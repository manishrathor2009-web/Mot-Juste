  <details class="panel"><summary class="h-sec" style="cursor:pointer">Synonyms and collocations</summary><div class="entry" style="margin-top:10px"><dl><div><dt>Synonyms and shades</dt><dd><ul>${synList(w.s)}</ul></dd></div>${w.c ? `<div><dt>Goes with</dt><dd>${esc(w.c)}</dd></div>` : ''}${w.f ? `<div><dt>Also learn</dt><dd>${esc(w.f)}</dd></div>` : ''}</dl></div></details>
  <div class="row"><button class="btn primary" data-act="intro-ok" style="flex:1">Got it</button><button class="btn" data-act="intro-known">I already know it</button></div></div>`;
}
function miniEntry(w, ex) {
  ex = ex || examplesOf(w)[0];
  return `<div class="mini stack" style="gap:6px"><div class="row" style="gap:10px"><span class="hw">${esc(w.w)}</span>${S.settings.ipa ? `<span class="ipa">${esc(w.i)}</span>` : ''}${speakBtn(w.w)}</div>
  <p class="read" style="margin:0">${esc(w.g)}</p>
  <p class="read muted" style="margin:0;font-size:.98rem">${esc(w.e)}</p>
  <p class="read" style="margin:0;font-size:1rem">${highlight(ex.t, ex.z)}</p></div>`;
}

/* =========================================================
   Study session
   ========================================================= */
let SES = null;
function buildQueue(due, news) {
  const q = shuffle(due.slice(0, 12)).concat(due.slice(12)).map(w => ({ w, kind: 'review' }));
  const step = news.length ? Math.max(2, Math.floor(q.length / news.length)) : 0;
  news.forEach((w, i) => q.splice(Math.min(q.length, Math.min(2, q.length) + i * (step + 1)), 0, { w, kind: 'intro' }));
  news.forEach(w => { const i = q.findIndex(x => x.w === w && x.kind === 'intro'); q.splice(Math.min(q.length, i + 3), 0, { w, kind: 'check' }); });
  return q;
}
function startSession(opts = {}) {
  let q;
  if (opts.words) q = opts.words.flatMap(w => (S.cards[w] && S.cards[w].intro) ? [{ w, kind: 'review', force: opts.force }] : [{ w, kind: 'intro' }, { w, kind: 'check' }]);
  else if (opts.quick) {
    const due = dueList();
    const pool = due.length ? due.slice(0, 6) : shuffle(WORDS.map(w => w.w).filter(w => stageOf(w) >= 1)).slice(0, 6);
    if (!pool.length) { const p = planRound(); q = buildQueue([], p.news.slice(0, 2)); }
    else q = pool.map(w => ({ w, kind: 'review' }));
  } else if (opts.extra) {
    const pool = shuffle(WORDS.map(w => w.w).filter(w => stageOf(w) >= 1)).slice(0, 10);
    q = pool.map(w => ({ w, kind: 'review' }));
  } else if (opts.more) {
    const news = newQueue().slice(0, opts.more);
    q = buildQueue([], news);
  } else { const p = planRound(); q = buildQueue(p.due, p.news); }
  if (!q.length) { toast('Nothing due. Try an extra round.'); return; }
  const before = {};
  q.forEach(it => { before[it.w] = stageOf(it.w); });
  SES = { q, i: 0, start: Date.now(), combo: 0, best: 0, ans: 0, ok: 0, xp: 0, miss: new Set(), before, done: {} };
  const st = $('#study'); st.hidden = false; document.body.style.overflow = 'hidden';
  renderStudy();
}
function renderStudy() {
  const st = $('#study');
  if (SES.i >= SES.q.length) return renderSummary();
  const item = SES.q[SES.i];
  const w = BYW.get(item.w);
  const long = SES.q.length > 24;
  const bar = long ? `<i class="done" style="width:${Math.round(100 * SES.i / SES.q.length)}%"></i>`
    : SES.q.map((x, i) => `<i class="${i < SES.i ? (x.missed ? 'miss' : 'done') : i === SES.i ? 'cur' : ''}"></i>`).join('');
  const body = item.kind === 'intro' ? introHTML(w) : renderExercise(item);
  st.innerHTML = `<div class="study-top"><button class="iconbtn" data-act="end" aria-label="End round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="progress${long ? ' solid' : ''}" aria-label="Progress: ${SES.i} of ${SES.q.length}">${bar}</div>${long ? `<span class="count">${SES.i}/${SES.q.length}</span>` : ''}<span class="combo">${SES.combo >= 3 ? '×' + SES.combo : ''}</span></div>
    <div class="study-body">${body}</div>`;
  st.scrollTop = 0;
  const autoSay = S.settings.autoplay && (item.kind === 'intro' || item.type === 'meaning' || item.type === 'produce');
  if (autoSay) setTimeout(() => speak(w.w), 250);
  const ti = $('#typedIn'); if (ti) setTimeout(() => ti.focus(), 60);
}
function endConfirm() {
  const top = $('.study-top');
  if ($('#endBar')) return;
  const bar = document.createElement('div');
  bar.id = 'endBar'; bar.className = 'panel row';
  bar.style.cssText = 'max-width:760px;margin:0 auto 6px;width:calc(100% - 32px)';
  bar.innerHTML = `<span style="flex:1">End this round? Answers so far are saved.</span><button class="btn small" data-act="end-yes">End round</button><button class="btn small ghost" data-act="end-no">Keep going</button>`;
  top.after(bar);
}
function closeStudy() { const st = $('#study'); st.hidden = true; st.innerHTML = ''; document.body.style.overflow = ''; SES = null; renderAll(); }

function answer(item, correct, quality) {
  const w = item.w, c = card(w), t = today();
  const firstToday = (item.kind === 'review' || item.kind === 'check') && c.last !== t;
  if (firstToday) schedule(c, correct ? quality : 1, t);
  if (correct && item.type === 'typed') c.typed++;
  c.u = Date.now();
  const xp = !correct ? 2 : item.kind === 'retry' ? 3 : item.type === 'produce' ? 25 : item.type === 'typed' ? 15 : 10;
  SES.ans++; SES.xp += xp;
  if (correct) { SES.ok++; SES.combo++; SES.best = Math.max(SES.best, SES.combo); } else { SES.combo = 0; SES.miss.add(w); item.missed = true; }
  logAdd({ a: 1, c: correct ? 1 : 0, xp, ety: correct && item.type === 'ety' ? 1 : 0 });
  if (!correct && item.kind !== 'retry') {
    const at = Math.min(SES.q.length, SES.i + 4);
    SES.q.splice(at, 0, { w, kind: 'retry' });
  }
  save();
}

function onOption(btn) {
  const item = SES.q[SES.i];
  if (item.answered) return;
  item.answered = true;
  const i = +btn.dataset.opt, chosen = item.opts[i], ok = chosen === item.answer;
  const secs = (Date.now() - item.shownAt) / 1000;
  const quality = ok ? (secs > 15 ? 2 : 3) : 1;
  $$('.opt').forEach(b => { b.disabled = true; const v = item.opts[+b.dataset.opt]; if (v === item.answer) b.classList.add('right'); });
  if (!ok) { btn.classList.add('wrong', 'shake'); }
  answer(item, ok, quality);
  showFeedback(item, ok, ok ? '' : item.type === 'meaning' ? 'The right meaning is marked in green.' : item.type === 'syn' ? `The closest is “${item.answer}”.` : `It’s “${item.answer}”.`);
}
function onTyped(e) {
  e.preventDefault();
  const item = SES.q[SES.i]; if (item.answered) return;
  const w = BYW.get(item.w), val = $('#typedIn').value;
  if (!val.trim()) { $('#typedIn').focus(); return; }
  const acc = new Set([norm(item.answer), norm(w.w)]);
  w.f.split(/[;,]/).forEach(p => { const x = norm(p.replace(/\(.*?\)/g, '').split(':')[0]); if (x && x.length > 2) acc.add(x); });
  const a = norm(val);
  let q = 0;
  if (acc.has(a)) q = (Date.now() - item.shownAt) / 1000 < 12 ? 4 : 3;
  else for (const t of acc) if (t.length >= 6 && lev(a, t) <= 1) { q = 2; break; }
  item.answered = true;
  $('#typedIn').disabled = true;
  answer(item, q > 0, q || 1);
  const msg = q === 2 ? `Nearly: the spelling is “${item.answer}”.` : q ? '' : `The word is “${item.answer}”.`;
  if (!q) $('#typedForm').classList.add('shake');
  showFeedback(item, q > 0, msg);
}
function giveUp() {
  const item = SES.q[SES.i]; if (item.answered) return;
  item.answered = true; answer(item, false, 1);
  showFeedback(item, false, `The word is “${item.answer}”.`);
}
function showFeedback(item, ok, msg) {
  const w = BYW.get(item.w);
  const ex = item.ex || examplesOf(w)[0];
  let extra = '';
  if (item.type === 'syn') extra = `<div class="entry"><dl><div><dt>Shades</dt><dd><ul>${synList(w.s)}</ul></dd></div></dl></div>`;
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'} slide-in"><div class="verdict">${ok ? 'Correct.' : 'Not quite.'} <span style="font-weight:400;color:var(--ink-2)">${esc(msg)}</span></div>${miniEntry(w, ex)}${extra}
    <button class="btn primary wide" data-act="next" id="nextBtn">Continue</button></div>`;
  const nb = $('#nextBtn'); if (nb) nb.focus({ preventScroll: true });
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function next() {
  SES.i++;
  if (SES.i < SES.q.length && SES.ans >= (SES.nextBreak || 20)) { SES.nextBreak = SES.ans + 20; return renderBreak(); }
  renderStudy();
}
function renderBreak() {
  const left = SES.q.length - SES.i;
  $('#study').innerHTML = `<div class="study-body stack slide-in" style="padding-top:40px"><p class="q-label">A breather</p>
    <article class="icard"><header class="icard-head"><h2 class="hw">${SES.ans} answers in</h2>
    <p class="read" style="margin:0">${SES.ok} correct${SES.best >= 5 ? `, best run ${SES.best}` : ''}. ${left} ${left === 1 ? 'card' : 'cards'} left in this round.</p></header></article>
    <div class="row actions"><button class="btn primary" data-act="keep-going">Keep going</button><button class="btn" data-act="stop-here">Stop here</button></div>
    <p class="hint">Stopping is fine. What you have answered is saved, and the rest will be waiting next time.</p></div>`;
}

function introOk(known) {
  const item = SES.q[SES.i], c = card(item.w);
  if (!c.intro) { c.intro = Date.now(); logAdd({ nw: 1, xp: 5 }); SES.xp += 5; }
  if (known) {
    markKnown(item.w);
    SES.q = SES.q.filter((x, i) => i <= SES.i || !(x.w === item.w && x.kind === 'check'));
  }
  c.u = Date.now(); save(); next();
}
function markKnown(w) {
  const c = card(w), t = today();
  if (!c.intro) c.intro = Date.now();
  Object.assign(c, { s: 30, d: 4, reps: Math.max(3, c.reps), typed: Math.max(1, c.typed), last: t, due: t + 30, known: true, u: Date.now() });
}
function produceCheck() {
  const item = SES.q[SES.i], w = BYW.get(item.w);
  const txt = $('#compose').value.trim();
  if (txt.length < 8) { toast('Write a full sentence first.'); $('#compose').focus(); return; }
  if (!containsWord(txt, w)) { toast(`Use “${w.w}” or one of its forms in the sentence.`); $('#compose').focus(); return; }
  item.text = txt;
  $('#compose').readOnly = true;
  const acts = $('#composeActs'); if (acts) acts.hidden = true;
  const ex = examplesOf(w);
  $('#fb').innerHTML = `<div class="feedback slide-in"><p class="q-label" style="margin:0">Model sentences</p>
    ${ex.slice(0, 2).map(e => `<p class="read" style="margin:0">${highlight(e.t, e.z)}</p>`).join('')}
    <div id="claudeOut"></div>
    ${Caps.sample ? `<button class="btn small" data-act="ask-claude" id="askBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>Ask Claude to check my sentence</button>` : ''}
    <p class="verdict" style="margin:6px 0 0;color:var(--ink)">How does your sentence read?</p>
    <div class="rate"><button class="btn" data-rate="3">Natural</button><button class="btn" data-rate="2">Unsure</button><button class="btn" data-rate="1">Misused</button></div></div>`;
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function containsWord(txt, w) {
  const t = norm(txt);
  const cands = [w.w, ...w.f.split(/[;,]/).map(p => p.replace(/\(.*?\)/g, '').split(':')[0])].map(norm).filter(x => x.length > 2);
  return cands.some(c => { const k = c.length > 5 ? c.slice(0, Math.max(4, c.length - 2)) : c; return t.includes(k); });
}
function rateProduce(r) {
  const item = SES.q[SES.i];
  if (item.answered) return;
  item.answered = true;
  const c = card(item.w);
  if (r >= 3) c.prod++;
  addNote(item.w, item.text, r, item.claude);
  answer(item, r >= 2, r);
  logAdd({ sent: 1 });
  save({ notes: true });
  next();
}
function skipProduce() {
  const item = SES.q[SES.i];
  SES.q.splice(SES.i, 1, Object.assign({}, item, { type: 'typed', force: 'typed', answered: false }));
  SES.q[SES.i].type = 'typed';
  renderStudy();
}
function addNote(w, t, v, fb) {
  S.notes.push({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), w, t, v, ts: Date.now(), fb: fb || null });
}

/* ---------- Claude review (claude.ai build only) ---------- */
const Caps = { sample: null, downloads: null };
async function askClaude(word, text) {
  const w = BYW.get(word);
  const prompt = `You are an exacting English usage editor. A learner who writes essays and exam answers (UPSC Civil Services, English literature) wrote this sentence to practise the word "${w.w}" (${w.p}: ${w.d}).

Sentence: "${text}"

Judge only whether "${w.w}" is used correctly and idiomatically: meaning, grammatical pattern, collocation and register. Be direct and plain; no praise padding, no lecturing.
Reply with only JSON: {"verdict":"natural"|"awkward"|"incorrect","comment":"one or two short sentences","suggestion":"a more idiomatic version of the sentence, or an empty string if it is already natural"}`;
  return Caps.sample.json(prompt, { modelTier: 'quick' });
}
function claudeErr(e) {
  const c = e && e.code;
  if (c === 'not_granted') return 'Claude checks are switched off for this page.';
  if (c === 'rate_limited') return 'Too many checks just now. Try again in a minute.';
  if (c === 'invalid_json') return 'Claude’s reply could not be read. Try again.';
  return 'Claude could not check this sentence right now.';
}
function claudeHTML(r) {
  const v = { natural: 'Natural', awkward: 'Awkward', incorrect: 'Misused' }[r.verdict] || 'Checked';
  const cls = r.verdict === 'natural' ? 'g' : r.verdict === 'awkward' ? 'h' : 'a';
  return `<div class="claude-box"><span class="badge ${cls}">${esc(v)}</span> ${esc(r.comment || '')}${r.suggestion ? `<br><span class="muted">Try:</span> ${esc(r.suggestion)}` : ''}</div>`;
}
async function onAskInStudy(btn) {
  const item = SES.q[SES.i];
  btn.disabled = true; $('#claudeOut').innerHTML = '<p class="hint">Claude is reading your sentence…</p>';
  try { const r = await askClaude(item.w, item.text); item.claude = r; $('#claudeOut').innerHTML = claudeHTML(r); }
  catch (e) { $('#claudeOut').innerHTML = `<p class="hint">${esc(claudeErr(e))}</p>`; btn.disabled = false; }
}

/* ---------- summary ---------- */
function renderSummary() {
  const secs = Math.round((Date.now() - SES.start) / 1000);
  logAdd({ r: 1, t: secs, p: SES.ans >= 10 && SES.ok === SES.ans ? 1 : 0 });
  earnFreezes(); ensureDeploy(); save();
  const acc = SES.ans ? Math.round(100 * SES.ok / SES.ans) : 0;
  const movers = Object.keys(SES.before).filter(w => stageOf(w) > SES.before[w]);
  const newly = checkSeals();
  const st = streak();

  $('#study').innerHTML = `<div class="study-body summary stack" style="padding-top:28px">
    <p class="h-sec">Round complete</p>

    ${S.deploy && S.deploy.words.length ? `<div class="panel stack" style="text-align:left;gap:8px;width:100%"><p class="h-sec">Put these to work today</p><p class="read" style="margin:0">${S.deploy.words.map(w => `<b>${esc(w)}</b>`).join(' · ')}</p><p class="hint" style="margin:0">Use one in a note, an answer or a conversation. Tomorrow I’ll ask how it went.</p></div>` : ''}
    <div class="row" style="width:100%"><button class="btn primary" style="flex:1" data-act="close-study">Done</button>${dueList().length ? `<button class="btn" data-act="again">Another round</button>` : newQueue().length ? `<button class="btn" data-act="more3">Learn 3 more</button>` : ''}</div>

/* =========================================================
   Deploy (use words in the wild)
   ========================================================= */
function ensureDeploy() {
  const t = today();
  if (S.deploy && S.deploy.day === t) return;
  if (S.deploy && S.deploy.day < t && !S.checked[S.deploy.day] && S.deploy.words.length) S.deployPrev = S.deploy;
  const rnd = mulberry(t);
  let cands = WORDS.map(w => w.w).filter(w => { const s = stageOf(w); return s >= 2 && s < 4; });
  if (cands.length < 3) cands = cands.concat(WORDS.map(w => w.w).filter(w => stageOf(w) === 1));
  cands = shuffle(cands, rnd).sort((a, b) => (S.cards[a].used + S.cards[a].prod) - (S.cards[b].used + S.cards[b].prod));
  S.deploy = { day: t, words: cands.slice(0, 3) };
}
function logUsed(words) {
  const t = today();
  words.forEach(w => { const c = card(w); if (c.usedDay !== t) { c.used++; c.usedDay = t; c.u = Date.now(); } });
  if (words.length) logAdd({ used: words.length, xp: 20 * words.length });
}

  { k: 'own10', g: 'X', t: 'Ten owned', d: 'Own 10 words' },
  { k: 'own100', g: 'C', t: 'A hundred owned', d: 'Own 100 words' },
  { k: 'wk', g: 'VII', t: 'A week', d: '7-day streak' },
  { k: 'mo', g: 'XXX', t: 'A month', d: '30-day streak' },
  { k: 'scribe', g: 'S', t: 'Scribe', d: 'Write 10 sentences' },
  { k: 'essayist', g: '¶', t: 'Columnist', d: 'Write 50 sentences' },
  { k: 'ety', g: 'η', t: 'Etymologist', d: 'Trace 30 word histories' },
  { k: 'perfect', g: '✓', t: 'Clean sheet', d: 'A round of 10 or more with no misses' },
  { k: 'wild', g: 'W', t: 'In the wild', d: 'Use 10 words outside the app' }
];
function sealStatus() {
  const tot = totals();
  const met = WORDS.filter(w => stageOf(w.w) >= 1).length, own = WORDS.filter(w => stageOf(w.w) === 4).length;
  const notes = S.notes.filter(n => !n.del).length, best = Math.max(bestStreak(), streak());
  return { first: tot.r >= 1, met50: met >= 50, met200: met >= 200, metall: met >= TOTAL, own10: own >= 10, own100: own >= 100, wk: best >= 7, mo: best >= 30, scribe: notes >= 10, essayist: notes >= 50, ety: tot.ety >= 30, perfect: tot.p >= 1, wild: tot.used >= 10 };
}
function checkSeals() {
  const st = sealStatus(), out = [];
  for (const s of SEALS) if (st[s.k] && !S.ach[s.k]) { S.ach[s.k] = Date.now(); out.push(s); }
  if (out.length) save();
  return out;
}
const sealHTML = s => `<div class="seal ${S.ach[s.k] ? 'on' : ''}"><div class="disc">${esc(s.g)}</div><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div>`;

function ring(v, max, label) {

}
function stageCounts() { const n = [0, 0, 0, 0, 0]; WORDS.forEach(w => n[stageOf(w.w)]++); return n; }

function wordOfDay() {
  const t = today(), rnd = mulberry(t * 7 + 3);
  const pool = WORDS.filter(w => { const s = stageOf(w.w); return s >= 1 && s <= 3; });
  if (pool.length) return pick(pool, rnd);
  const nq = newQueue(); return nq.length ? BYW.get(nq[0]) : null;
}

const LEX = { q: '', stage: 'all', topic: '' };
const TOPICS = Array.from(new Set(WORDS.flatMap(w => (w.t || '').split(';').map(x => x.trim()).filter(Boolean)))).sort((a, b) => a.localeCompare(b));
function renderLexicon() {

      <div class="lex" id="lexList"></div></div>
      <nav class="thumbs" id="thumbs" aria-label="Jump to letter"></nav>`;
    v.dataset.built = '1';
    $('#lexQ').addEventListener('input', e => { LEX.q = e.target.value; renderLexList(); });
    $('#lexTopic').addEventListener('change', e => { LEX.topic = e.target.value; renderLexList(); });
  }
  renderLexList();
}
function renderLexList() {
  const q = norm(LEX.q);
  const list = WORDS.filter(w => {
    if (LEX.stage === 'starred' && !(S.cards[w.w] && S.cards[w.w].star)) return false;
    if (/^\d$/.test(LEX.stage) && stageOf(w.w) !== +LEX.stage) return false;
    if (LEX.topic && !(w.t || '').split(';').map(x => x.trim()).includes(LEX.topic)) return false;
    if (q && !norm(w.w).includes(q) && !norm(w.g).includes(q) && !norm(w.f).includes(q)) return false;
    return true;
  });
  $('#lexCount').textContent = `${list.length} word${list.length === 1 ? '' : 's'}`;
  let html = '', cur = '';
  const letters = [];
  for (const w of list) {
    const L = w.w[0].toUpperCase();
    if (L !== cur) { cur = L; letters.push(L); html += `<h2 class="lex-letter" id="L-${L}">${L}</h2>`; }
    const s = stageOf(w.w);
    html += `<button class="lex-row" data-open="${esc(w.w)}"><span class="w">${esc(w.w)}<small>${esc(posShort(w.p))}</small>${S.cards[w.w] && S.cards[w.w].star ? ' <span aria-label="starred" style="color:var(--amber)">★</span>' : ''}</span>
      <span class="pips" aria-label="${STAGES[s]}" title="${STAGES[s]}">${[1, 2, 3, 4].map(i => `<i style="background:${i <= s ? `var(--s${s})` : 'var(--s0)'}"></i>`).join('')}</span><span class="g">${esc(w.g)}</span></button>`;
  }
  $('#lexList').innerHTML = html || '<p class="empty">No words match. Try a shorter search or another filter.</p>';
  $('#thumbs').innerHTML = letters.length > 3 && !q ? letters.map(L => `<button data-jump="${L}" aria-label="Jump to ${L}">${L}</button>`).join('') : '';
  $$('#lexStages .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.stage === LEX.stage ? 'true' : 'false'));
}

  </div>`;
}
function heatmap() {
  const t = today(), weeks = 18, cell = 13, gap = 3;
  const dow = (new Date(t * DAY).getUTCDay() + 6) % 7;
  const start = t - dow - (weeks - 1) * 7;
  let rects = '';
  for (let wk = 0; wk < weeks; wk++) for (let d = 0; d < 7; d++) {
    const day = start + wk * 7 + d; if (day > t) continue;
    const a = dayStats(dkey(day)).a, fr = S.frozen.includes(day);
    const fill = goalMet(day) ? 'var(--s3)' : a >= S.settings.goal / 2 ? 'var(--s2)' : a > 0 ? 'var(--s1)' : 'var(--s0)';
    rects += `<rect x="${wk * (cell + gap)}" y="${d * (cell + gap) + 14}" width="${cell}" height="${cell}" rx="3" fill="${fill}" ${fr ? 'stroke="var(--amber)" stroke-width="2"' : ''}><title>${dkey(day)}: ${a} answers${fr ? ' (freeze)' : ''}</title></rect>`;
  }
  let months = '', lastM = -1, lastX = -99;
  for (let wk = 0; wk < weeks; wk++) { const m = new Date((start + wk * 7) * DAY).getUTCMonth(); if (m !== lastM) { lastM = m; const nextM = new Date((start + (wk + 2) * 7) * DAY).getUTCMonth(); if (wk === 0 && nextM !== m) continue; if (wk - lastX < 3) continue; lastX = wk; months += `<text x="${wk * (cell + gap)}" y="10" fill="var(--ink-3)" font-size="10" font-family="var(--f-ui)">${new Date((start + wk * 7) * DAY).toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' })}</text>`; } }
  const W = weeks * (cell + gap), H = 7 * (cell + gap) + 14;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily activity for the last 18 weeks">${months}${rects}</svg>`;
}
function forecast() {
  const t = today(), days = 14, counts = new Array(days).fill(0);
  for (const k in S.cards) { const c = S.cards[k]; if (!c.intro || !BYW.has(k)) continue; const i = Math.max(0, (c.due || t) - t); if (i < days) counts[i]++; }
  const max = Math.max(4, ...counts), W = 340, H = 150, bw = W / days;
  let g = '';
  counts.forEach((v, i) => {
    const h = Math.round((H - 36) * v / max), x = i * bw + 3, y = H - 20 - h;
    g += `<rect x="${x}" y="${y}" width="${bw - 6}" height="${Math.max(h, 1)}" rx="3" fill="${i === 0 ? 'var(--accent)' : 'var(--s2)'}"><title>${fmtDay(t + i, { weekday: 'short', day: 'numeric' })}: ${v}</title></rect>`;
    if (v) g += `<text x="${x + (bw - 6) / 2}" y="${y - 4}" text-anchor="middle">${v}</text>`;
    g += `<text x="${i === 0 ? x : x + (bw - 6) / 2}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : 'middle'}">${i === 0 ? 'Today' : i % 2 === 0 ? fmtDay(t + i, { day: 'numeric' }) : ''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reviews due over the next 14 days">${g}<line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--edge)"/></svg>`;
}

   ${BUILD === 'pwa' && !standalone ? `<div class="panel stack" style="gap:6px"><p class="h-sec">Install on this device</p><p style="margin:0"><b>iPad or iPhone:</b> in Safari, tap Share, then Add to Home Screen.</p><p style="margin:0"><b>Android:</b> in Chrome, open the ⋮ menu, then Install app.</p><p class="hint" style="margin:0">Once installed it opens full-screen and works without internet.</p></div>` : ''}
   <div class="panel stack" style="gap:8px"><p class="h-sec danger">Start over</p><p style="margin:0" class="hint">Erases all progress, streaks and sentences${Sync.db ? ', on every device' : ' on this device'}.</p>
     <div class="row"><label class="sr" for="resetIn">Type RESET to confirm</label><input id="resetIn" placeholder="Type RESET" class="chip" style="font-weight:400;padding:8px 12px;border-radius:10px"><button class="btn small danger" data-act="reset">Erase progress</button></div></div>
   <p class="hint">${TOTAL} words from your list, checked against Oxford Learner’s Dictionaries, Merriam-Webster and Etymonline. Reviews are timed with a spaced-repetition model so each word returns just as it starts to fade.</p>
  </div>`);
  renderVoiceOptions();
  $('#autoSw').addEventListener('change', e => { s.autoplay = e.target.checked; s.u = Date.now(); save(); });
  $('#ipaSw').addEventListener('change', e => { s.ipa = e.target.checked; s.u = Date.now(); save(); });
  $('#voiceSel').addEventListener('change', e => { s.voice = e.target.value; s.u = Date.now(); save(); speak('Mot juste'); });
  $('#importFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { importBackup(await f.text()); } catch (err) { toast('That file is not a Mot Juste backup.'); } });
}
function renderVoiceOptions() {
  const sel = $('#voiceSel'); if (!sel) return;
  const v = pickVoice();
  sel.innerHTML = VOICES.length ? VOICES.map(x => `<option value="${esc(x.voiceURI)}" ${v && v.voiceURI === x.voiceURI ? 'selected' : ''}>${esc(x.name)} (${esc(x.lang)})</option>`).join('') : '<option>No English voices on this device</option>';
}
function applyTheme() {
  if (BUILD !== 'pwa') return;
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
function backupText() { return JSON.stringify({ app: 'motjuste', exported: new Date().toISOString(), state: S }); }
async function exportBackup() {
  const name = `mot-juste-backup-${dkey(today())}.json`, data = backupText();
  if (BUILD === 'artifact') {
    if (!Caps.downloads) { toast('Saving files is not available here. Use Copy backup text.'); return; }
    try { await Caps.downloads.save({ filename: name, data }); } catch (e) { if (e && e.code !== 'declined') toast('The file could not be saved. Use Copy backup text.'); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  catch (e) { toast('The file could not be saved. Use Copy backup text.'); }
}
async function copyBackup() {
  const data = backupText();
  try { await navigator.clipboard.writeText(data); toast('Backup copied. Paste it into the other copy of the app.'); }
  catch (e) { const ta = $('#pasteIn'); if (ta) { ta.closest('details').open = true; ta.value = data; ta.select(); toast('Select-all and copy the text in the box.'); } }
}
function importBackup(text) {
  const obj = JSON.parse(text);
  const st = obj && obj.state ? obj.state : obj;
  if (!st || st.v !== 1 || !st.cards) throw new Error('bad');
  mergeState(normalize(st), true);
  save({ notes: true }); renderAll(); closeSheet(); toast('Backup merged.');
}

/* =========================================================
   Merge + cloud sync (claude.ai build)
   ========================================================= */
function mergeState(r, withNotes) {
  const rReset = (r.meta && r.meta.reset) || 0;
  if (rReset > (S.meta.reset || 0)) { const keep = S.settings; S = normalize(fresh()); S.settings = keep; S.meta.reset = rReset; }
  for (const k in r.cards || {}) { const rc = r.cards[k], lc = S.cards[k]; if (!lc || (rc.u || 0) > (lc.u || 0)) S.cards[k] = rc; }
  for (const d in r.log || {}) { const rd = r.log[d], ld = S.log[d] || (S.log[d] = {}); for (const dv in rd) { const rr = rd[dv], ll = ld[dv] || (ld[dv] = {}); for (const f in rr) ll[f] = Math.max(ll[f] || 0, rr[f] || 0); } }
  for (const k in r.ach || {}) if (!S.ach[k] || r.ach[k] < S.ach[k]) S.ach[k] = r.ach[k];
  for (const k in r.checked || {}) S.checked[k] = true;
  if (r.deploy && (!S.deploy || r.deploy.day > S.deploy.day)) S.deploy = r.deploy;
  if (r.settings && (r.settings.u || 0) > (S.settings.u || 0)) S.settings = Object.assign(S.settings, r.settings);
  S.frozen = Array.from(new Set(S.frozen.concat(r.frozen || [])));
  if ((r.meta && r.meta.u || 0) > (S.meta.u || 0)) { S.freezes = r.freezes || 0; S.fEarned = r.fEarned || 0; S.deployPrev = r.deployPrev || S.deployPrev; }
  if (withNotes && r.notes) mergeNotes(r.notes);
}
function mergeNotes(rn) {
  const byId = new Map(S.notes.map(n => [n.id, n]));
  for (const n of rn) { const l = byId.get(n.id); if (!l) { S.notes.push(n); byId.set(n.id, n); } else { if (n.del) l.del = true; if (n.fb && !l.fb) l.fb = n.fb; } }
}
const bytes = o => new Blob([JSON.stringify(o)]).size;
const DOC_MAX = 240000;   // the store takes documents up to 256 KiB
function progressBody() { const b = Object.assign({}, S); delete b.notes; delete b.log; return JSON.parse(JSON.stringify(b)); }
function logBody() {
  const log = JSON.parse(JSON.stringify(S.log));
  const days = Object.keys(log).sort();
  while (days.length > 30 && bytes({ log }) > DOC_MAX) delete log[days.shift()];
  return { log };
}
function notesBody() {
  const out = []; let size = 20;
  for (let i = S.notes.length - 1; i >= 0; i--) { const n = S.notes[i]; const b = bytes(n) + 1; if (size + b > DOC_MAX) break; out.unshift(n); size += b; }
  return { notes: out };
}

const Sync = {
  db: null, uid: null, status: 'local', timer: null, busy: false, dirty: false, notesDirty: false,
  label() {
    if (BUILD === 'pwa') return 'Saved on this device. To move it, save a backup file and load it on the other device.';
    if (this.status === 'synced') return 'Synced to your Claude account, so it follows you across devices.';
    if (this.status === 'error') return 'Saved on this device; the last sync to your account failed and will be retried.';
    return 'Saved on this device only.';
  },
  refs() { const base = `data/users/${this.uid}/`; return { p: this.db.doc(base + 'progress'), l: this.db.doc(base + 'log'), n: this.db.doc(base + 'notebook') }; },
  async init() {
    if (BUILD !== 'artifact' || !window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      await this.pull();
      if (this.status === 'synced') { applyFreezes(); renderAll(); }
    } catch (e) { this.status = 'local'; }
  },
  async pull() {
    try {
      const { p, l, n } = this.refs();
      const [a, lg, b] = await Promise.all([p.get(), l.get(), n.get()]);
      if (a.exists) mergeState(Object.assign({}, a.data(), { log: lg.exists ? lg.data().log : {} }), false);
      if (b.exists && Array.isArray(b.data().notes)) mergeNotes(b.data().notes);
      this.status = 'synced';
      lsSet(KEY, JSON.stringify(S));
      if (!a.exists || Object.keys(S.cards).length) { this.dirty = true; this.notesDirty = S.notes.length > 0; this.flush(); }
    } catch (e) { this.status = 'error'; }
  },
  schedule(notes) {
    if (!this.db) return;
    this.dirty = true; if (notes) this.notesDirty = true;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 3500);
  },
  async flush() {
    if (!this.db || (!this.dirty && !this.notesDirty)) return;
    if (this.busy) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); return; }
    this.busy = true;
    const doP = this.dirty, doN = this.notesDirty; this.dirty = false; this.notesDirty = false;
    try {
      const { p, l, n } = this.refs();
      if (doP) { await p.set(progressBody()); await l.set(logBody()); }
      if (doN) await n.set(notesBody());
      this.status = 'synced';
    } catch (e) {
      if (e && e.code === 'invalid_argument') { this.db = null; this.status = 'local'; }
      else { this.status = 'error'; this.dirty = this.dirty || doP; this.notesDirty = this.notesDirty || doN; }
    }
    this.busy = false;
    if (this.dirty || this.notesDirty) this.schedule();
  }
};

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-act], .scrim');
  if (!t) return;
  if (t.classList && t.classList.contains('scrim') && e.target === t) { closeSheet(); return; }
  const sp = e.target.closest('[data-speak]'); if (sp) { speak(sp.dataset.speak); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab); try { history.replaceState(null, '', '#' + tab.dataset.tab); } catch (_) { } return; }
  const op = e.target.closest('[data-open]'); if (op) { openEntry(op.dataset.open); return; }
  const opt = e.target.closest('.opt'); if (opt && SES) { onOption(opt); return; }
  const jump = e.target.closest('[data-jump]'); if (jump) { const el = document.getElementById('L-' + jump.dataset.jump); if (el) el.scrollIntoView({ block: 'start' }); return; }
  const stg = e.target.closest('[data-stage]'); if (stg) { LEX.stage = stg.dataset.stage; renderLexList(); return; }
  const rate = e.target.closest('[data-rate]'); if (rate && SES) { rateProduce(+rate.dataset.rate); return; }
  const used = e.target.closest('[data-used]'); if (used) { used.setAttribute('aria-pressed', used.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
  const setb = e.target.closest('[data-set]'); if (setb) { S.settings[setb.dataset.set] = +setb.dataset.val; S.settings.u = Date.now(); save(); $$(`[data-set="${setb.dataset.set}"]`).forEach(b => b.setAttribute('aria-pressed', b === setb ? 'true' : 'false')); renderAll(); return; }
  const th = e.target.closest('[data-theme-set]'); if (th) { S.settings.theme = th.dataset.themeSet; S.settings.u = Date.now(); save(); applyTheme(); $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b === th ? 'true' : 'false')); return; }
  const nbr = e.target.closest('[data-nbrate]'); if (nbr) { notebookSave(+nbr.dataset.nbrate); return; }
  const act = t.dataset && t.dataset.act; if (!act) return;
  switch (act) {
    case 'start': startSession(); break;
    case 'quick': startSession({ quick: true }); break;
    case 'extra': startSession({ extra: true }); break;
    case 'more3': if (SES) closeStudy(); startSession({ more: 3 }); break;
    case 'again': SES = null; startSession(); break;
    case 'end': endConfirm(); break;
    case 'end-yes': closeStudy(); break;
    case 'end-no': { const b = $('#endBar'); if (b) b.remove(); break; }
    case 'close-study': closeStudy(); break;
    case 'next': next(); break;
    case 'keep-going': renderStudy(); break;
    case 'stop-here': renderSummary(); break;
    case 'giveup': giveUp(); break;
    case 'intro-ok': introOk(false); break;
    case 'intro-known': introOk(true); break;
    case 'produce-check': produceCheck(); break;
    case 'skip-produce': skipProduce(); break;
    case 'ask-claude': onAskInStudy(t); break;
    case 'close-sheet': closeSheet(); break;
    case 'practise': { const w = t.dataset.w; closeSheet(); startSession({ words: [w] }); break; }
    case 'write': { const w = t.dataset.w; closeSheet(); if (!SES) { startSession({ words: [w], force: 'produce' }); } break; }
    case 'star': { const c = card(t.dataset.w); c.star = !c.star; c.u = Date.now(); save(); t.textContent = c.star ? '★ Starred' : '☆ Star'; if (TAB === 'lexicon') renderLexList(); break; }
    case 'known': { markKnown(t.dataset.w); save(); openEntry(t.dataset.w); renderAll(); toast('Marked as known. It will come back in a month.'); break; }
    case 'used-today': { logUsed([t.dataset.w]); save(); t.textContent = 'Used today ✓'; renderTop(); break; }
    case 'log-used': { const ws = $$('#checkWords [aria-pressed="true"]').map(b => b.dataset.used); logUsed(ws); S.checked[S.deployPrev.day] = true; S.deployPrev = null; save(); renderAll(); toast(ws.length ? `Logged ${ws.length} word${ws.length > 1 ? 's' : ''} used. +${20 * ws.length} XP` : 'Logged.'); break; }
    case 'none-used': { S.checked[S.deployPrev.day] = true; S.deployPrev = null; save(); renderAll(); break; }
    case 'nb-del': { const id = t.dataset.id; if (t.dataset.confirm) { const n = S.notes.find(x => x.id === id); if (n) { n.del = true; n.t = ''; } save({ notes: true }); renderNotebook(); } else { t.dataset.confirm = '1'; t.textContent = 'Tap again to delete'; t.classList.add('danger'); } break; }
    case 'nb-ask': { const n = S.notes.find(x => x.id === t.dataset.id); if (!n) break; const out = t.closest('.nb-item').querySelector('.nb-out'); t.disabled = true; out.innerHTML = '<p class="hint">Claude is reading your sentence…</p>'; try { n.fb = await askClaude(n.w, n.t); save({ notes: true }); renderNotebook(); } catch (err) { out.innerHTML = `<p class="hint">${esc(claudeErr(err))}</p>`; t.disabled = false; } break; }
    case 'test-voice': speak('Abnegation. Perspicacious. Mot juste.'); break;
    case 'export': exportBackup(); break;
    case 'copy-backup': copyBackup(); break;
    case 'paste-import': { try { importBackup($('#pasteIn').value); } catch (err) { toast('That text is not a Mot Juste backup.'); } break; }
    case 'reset': { if (($('#resetIn').value || '').trim().toUpperCase() !== 'RESET') { toast('Type RESET to confirm.'); break; } const keep = S.settings; S = fresh(); S.settings = keep; S.meta.u = Date.now(); S.meta.reset = Date.now(); save({ notes: true }); Sync.dirty = true; Sync.notesDirty = true; Sync.flush(); closeSheet(); renderAll(); toast('Progress erased.'); break; }
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'typedForm') onTyped(e); });
document.addEventListener('keydown', e => {
  if (!SES || $('#study').hidden) { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  const item = SES.q[SES.i];
  if (/^[1-4]$/.test(e.key) && item && !item.answered) { const b = $(`.opt[data-opt="${+e.key - 1}"]`); if (b) { e.preventDefault(); onOption(b); } }
  else if (e.key === 'Enter') { const n = $('#nextBtn') || $('[data-act="intro-ok"]') || $('[data-act="close-study"]'); if (n) { e.preventDefault(); n.click(); } }
});
$('#settingsBtn').addEventListener('click', openSettings);
$('#streakPill').addEventListener('click', () => setTab('progress'));
$('#xpPill').addEventListener('click', () => setTab('progress'));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { Sync.flush(); }
  else if (Sync.db && !Sync.dirty && !Sync.busy) { Sync.pull().then(() => { if (!SES) renderAll(); }); }
});

function notebookSave(v) {
  const word = ($('#nbWord').value || '').trim(), text = ($('#nbText').value || '').trim();
  const w = BYW.get(word) || WORDS.find(x => x.w.toLowerCase() === word.toLowerCase());
  if (!w) { toast('Choose a word from your lexicon.'); $('#nbWord').focus(); return; }
  if (text.length < 8) { toast('Write a full sentence first.'); $('#nbText').focus(); return; }
  if (!containsWord(text, w)) { toast(`Use “${w.w}” or one of its forms.`); return; }
  const c = card(w.w);
  if (!c.intro) { c.intro = Date.now(); logAdd({ nw: 1 }); }
  if (v >= 3) c.prod++;
  c.u = Date.now();
  addNote(w.w, text, v, null);
  logAdd({ sent: 1, xp: 25 });
  save({ notes: true });
  $('#nbText').value = '';
  renderNotebook(); renderTop();
  toast('Saved to your notebook. +25 XP');
}

/* =========================================================
   Boot
   ========================================================= */
applyTheme();
applyFreezes();
ensureDeploy();
save();
const hash = (location.hash || '').replace('#', '');
setTab(TABS.includes(hash) ? hash : 'today');
renderTop();

(async () => {
  if (BUILD === 'artifact' && window.claude && window.claude.use) {
    window.claude.use('sample').then(s => { Caps.sample = s; if (s && TAB === 'notebook') renderNotebook(); }).catch(() => { });
    window.claude.use('downloads').then(d => { Caps.downloads = d; }).catch(() => { });
    await Sync.init();
  }
  if (BUILD === 'pwa' && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { } }
})();

})();
