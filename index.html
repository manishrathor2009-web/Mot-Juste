<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mot Juste</title>
<meta name="description" content="Your 484 words, learnt a few at a time until you use them without thinking.">
<meta name="theme-color" content="#E6E9E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mot Juste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}img{max-width:100%}</style>
<style>
:root{
  --desk:#E6E9E3; --desk-2:#DCE0D8; --card:#FFFDF8; --card-2:#F6F5F0;
  --ink:#1C2230; --ink-2:#4A5262; --ink-3:#747C8B; --edge:#CBD0C6;
  --rule-blue:#C9D7EA; --rule-red:#D0473E;
  --accent:#2445B5; --accent-ink:#FFFFFF; --accent-soft:#E3E8F8;
  --amber:#C97A12; --good:#2C7A4E; --good-soft:#E0F0E6; --bad:#B8392F; --bad-soft:#F8E4E1;
  --s0:#C6CBD3; --s1:#9FB3E6; --s2:#5C7FD6; --s3:#2445B5; --s4:#1B6B45;
  --shadow:rgba(28,34,48,.18);
  --f-display:"IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-read:"Gentium Book Plus", "Charis SIL", "Iowan Old Style", Georgia, serif;
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --lh:28px;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#111418; --desk-2:#171B21; --card:#1B2028; --card-2:#222834;
    --ink:#ECE9E1; --ink-2:#B9BFCB; --ink-3:#8A92A1; --edge:#2B313C;
    --rule-blue:#26344A; --rule-red:#D2574D;
    --accent:#8FA5FF; --accent-ink:#0E1330; --accent-soft:#232C4A;
    --amber:#F0A83A; --good:#5BBF8A; --good-soft:#18342A; --bad:#EF7A70; --bad-soft:#3A1F1E;
    --s0:#3A414D; --s1:#3E5690; --s2:#5C7FD6; --s3:#8FA5FF; --s4:#5BBF8A;
    --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#111418; --desk-2:#171B21; --card:#1B2028; --card-2:#222834;
  --ink:#ECE9E1; --ink-2:#B9BFCB; --ink-3:#8A92A1; --edge:#2B313C;
  --rule-blue:#26344A; --rule-red:#D2574D;
  --accent:#8FA5FF; --accent-ink:#0E1330; --accent-soft:#232C4A;
  --amber:#F0A83A; --good:#5BBF8A; --good-soft:#18342A; --bad:#EF7A70; --bad-soft:#3A1F1E;
  --s0:#3A414D; --s1:#3E5690; --s2:#5C7FD6; --s3:#8FA5FF; --s4:#5BBF8A;
  --shadow:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--desk) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
.brand{font-family:var(--f-display);font-style:italic;font-size:1.45rem;letter-spacing:.01em;margin:0;line-height:1;white-space:nowrap}
.brand b{font-style:normal;font-weight:400;color:var(--rule-red)}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--edge);font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.streak svg{color:var(--amber)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.iconbtn:hover{background:var(--card);border-color:var(--edge)}
.iconbtn svg{width:22px;height:22px}

main{min-width:0;padding-inline:16px;padding-block:18px 110px;width:100%;max-width:780px;margin-inline:auto}
.view[hidden]{display:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;border:0;background:none;color:var(--ink-3);font-size:.75rem;font-weight:700;letter-spacing:.02em}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

@media (min-width:960px){
  .shell{grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar{grid-column:1 / -1}
  .tabbar{position:sticky;top:64px;align-self:start;grid-row:2;grid-column:1;display:flex;flex-direction:column;gap:4px;background:transparent;border:0;padding:24px 12px;height:auto}
  .tab{flex-direction:row;gap:12px;padding:12px 14px;border-radius:10px;font-size:.95rem;justify-content:flex-start}
  .tab[aria-current="page"]{background:var(--card);box-shadow:0 1px 0 var(--edge)}
  main{grid-row:2;grid-column:2;padding-bottom:60px}
}

/* ---------- type ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.h-screen{font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:.005em}
.h-sec{font-family:var(--f-ui);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kicker{font-size:.9rem;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.read{font-family:var(--f-read);font-size:1.08rem;line-height:1.6}
.ipa{font-family:var(--f-read);color:var(--ink-2);font-size:1rem}
.pos{font-family:var(--f-read);font-style:italic;color:var(--ink-2)}
mark{background:transparent;color:inherit;font-weight:700;border-bottom:2px solid var(--accent);padding:0 1px}

.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font-weight:700;font-size:1rem;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--card-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:10px}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--edge);background:var(--card);font-size:.9rem;color:var(--ink-2);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.word{font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--ink)}

/* ---------- the index card ---------- */
.icard{position:relative;background:var(--card);border-radius:8px;box-shadow:0 1px 0 var(--edge),0 18px 40px -26px var(--shadow),0 2px 6px -3px var(--shadow)}
.icard-head{padding:18px 22px 12px;border-bottom:2px solid var(--rule-red)}
.icard-head .hw{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,7.5vw,2.7rem);line-height:1.08;overflow-wrap:anywhere;margin:0}
.icard-head .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.icard-body{padding:0 22px 22px;line-height:var(--lh);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule-blue) calc(var(--lh) - 1px),var(--rule-blue) var(--lh));background-position:0 0}
.icard-body > *{margin:0}
.icard-body .read{font-size:1.06rem;line-height:var(--lh)}
.icard-body .lbl{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);line-height:var(--lh);display:block}
.icard-body .gap{height:var(--lh)}
.icard .corner{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.speak{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:var(--card-2);color:var(--accent)}
.speak svg{width:18px;height:18px}
.tagline{font-size:.8rem;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ---------- today ---------- */
.dateline{font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:var(--ink-2)}
.round{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.round .figs{display:flex;gap:22px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto;white-space:nowrap}
.fig{display:flex;flex-direction:column}
.fig b{font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.fig span{font-size:.8rem;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:.8rem;line-height:1.15;color:var(--ink-2)}
.ring .lab b{display:block;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.preview{display:flex;gap:8px;flex-wrap:wrap}
.deploy{display:grid;gap:10px}
.deploy-item{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--edge);text-align:left;width:100%}
.deploy-item .w{font-family:var(--f-display);font-size:1.35rem}
.deploy-item .g{font-family:var(--f-read);color:var(--ink-2);font-size:.98rem;grid-column:1 / -1}
.panel{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px}
.wotd .hw{font-family:var(--f-display);font-size:1.9rem;line-height:1.1}
.wotd .ety{font-family:var(--f-read);font-size:1.02rem;color:var(--ink-2)}
.stagebar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--s0)}
.stagebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- study ---------- */
.study{position:fixed;inset:0;z-index:50;background:var(--desk);display:flex;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study-top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:760px;width:100%;margin-inline:auto}
.progress{flex:1;display:flex;gap:3px;height:8px}
.progress i{flex:1;border-radius:3px;background:var(--s0)}
.progress i.done{background:var(--accent)}
.progress i.miss{background:var(--rule-red)}
.progress i.cur{background:var(--ink-3)}
.progress.solid{display:block;border-radius:999px;background:var(--s0);overflow:hidden}
.progress.solid i{display:block;height:100%;border-radius:999px;transition:width .3s ease}
.study-top .count{font-size:.85rem;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.combo{font-weight:700;font-size:.85rem;color:var(--amber);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.study-body{flex:1;width:100%;max-width:760px;margin-inline:auto;padding:8px 16px 28px;display:flex;flex-direction:column;gap:18px}
.q-label{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.q-prompt{font-family:var(--f-read);font-size:1.2rem;line-height:1.55}
.q-prompt .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 2px;color:var(--accent);font-weight:700;text-align:center}
.options{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);font-family:var(--f-read);font-size:1.04rem;line-height:1.45;transition:border-color .12s, background .12s, transform .08s}
.opt.w{font-family:var(--f-display);font-size:1.4rem;line-height:1.2}
.opt:hover{border-color:var(--ink-3)}
.opt .k{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--desk-2);color:var(--ink-2);font-family:var(--f-ui);font-size:.8rem;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.answer{display:flex;gap:10px;align-items:stretch}
.answer input{flex:1;min-width:0;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);font-family:var(--f-read);font-size:1.25rem}
.answer input:focus{outline:none;border-color:var(--accent)}
textarea.compose{width:100%;min-height:130px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--edge);background:var(--card);font-family:var(--f-read);font-size:1.12rem;line-height:1.55;resize:vertical}
textarea.compose:focus{outline:none;border-color:var(--accent)}
.hint{font-size:.9rem;color:var(--ink-3)}
.feedback{border-radius:14px;padding:14px 16px;border:1.5px solid var(--edge);background:var(--card);display:flex;flex-direction:column;gap:8px}
.feedback.ok{border-color:var(--good)}
.feedback.no{border-color:var(--bad)}
.verdict{font-weight:700;font-size:1.05rem}
.feedback.ok .verdict{color:var(--good)}
.feedback.no .verdict{color:var(--bad)}
.mini .hw{font-family:var(--f-display);font-size:1.5rem}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.claude-box{border-left:3px solid var(--accent);padding:6px 0 6px 12px;font-family:var(--f-read);font-size:1rem}
.shake{animation:shake .32s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.slide-in{animation:slidein .28s ease}
@keyframes slidein{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- summary + stamp ---------- */
.summary{align-items:center;text-align:center}
.stamp{margin:18px auto 6px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border:3px double var(--accent);color:var(--accent);border-radius:6px;transform:rotate(-4deg);font-family:var(--f-ui);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;
  -webkit-mask-image:radial-gradient(circle at 20% 30%,#000 60%,rgba(0,0,0,.75) 61%),radial-gradient(circle at 80% 70%,#000 55%,rgba(0,0,0,.8) 56%);-webkit-mask-composite:source-in;mask-image:radial-gradient(circle at 20% 30%,#000 60%,rgba(0,0,0,.78) 61%)}
.stamp .big{font-size:1.9rem;letter-spacing:.06em;line-height:1.1}
.stamp.press{animation:press .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes press{0%{transform:rotate(-12deg) scale(1.6);opacity:.2}60%{transform:rotate(-3deg) scale(.96);opacity:1}100%{transform:rotate(-4deg) scale(1)}}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.sumgrid .fig{align-items:center;padding:12px 6px;background:var(--card);border:1px solid var(--edge);border-radius:12px}
.sumgrid .fig b{font-size:1.9rem}
.movers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* ---------- lexicon ---------- */
.searchbar{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--edge);border-radius:12px;padding:0 12px}
.searchbar svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;min-height:48px;font-size:1.02rem}
.searchbar input:focus{outline:none}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.lex{position:relative;padding-right:30px}
.lex-letter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:5;font-family:var(--f-display);font-size:1.6rem;padding:6px 0 4px;background:var(--desk);border-bottom:1px solid var(--edge);margin-top:10px}
.lex-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:12px 4px;border:0;border-bottom:1px solid var(--edge);background:none}
.lex-row:hover{background:var(--card)}
.lex-row .w{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.lex-row .w small{font-family:var(--f-read);font-style:italic;font-size:.9rem;color:var(--ink-3);margin-left:6px}
.lex-row .g{grid-column:1;font-family:var(--f-read);font-size:.96rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:inline-flex;gap:3px;grid-row:1 / span 2;grid-column:2}
.pips i{width:7px;height:18px;border-radius:2px;background:var(--s0)}
.thumbs{position:fixed;right:max(4px,calc((100vw - 780px)/2 - 30px));top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:1px}
.thumbs button{width:24px;height:clamp(14px,2.6vh,22px);border:0;border-radius:4px 0 0 4px;background:var(--card);color:var(--ink-2);font-family:var(--f-display);font-size:.8rem;line-height:1;padding:0;box-shadow:inset -2px 0 0 var(--edge)}
.thumbs button:hover{background:var(--accent-soft);color:var(--accent)}
@media (min-width:960px){.thumbs{right:max(4px,calc((100vw - 220px - 780px)/2 - 30px))}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,12,18,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--desk);border-radius:18px 18px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px -10px var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--edge);margin:0 auto 10px}
.entry .sense{font-family:var(--f-read);font-size:1.08rem;line-height:1.6}
.entry dl{margin:0;display:grid;gap:14px}
.entry dt{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.entry dd{margin:0;font-family:var(--f-read);font-size:1.02rem;line-height:1.55}
.entry dd ul{margin:0;padding-left:1.1em}
.entry dd li{margin:2px 0}
.ex{margin:0 0 8px;font-family:var(--f-read);font-size:1.02rem;line-height:1.55}
.ex.yours{border-left:3px solid var(--rule-red);padding-left:10px}
.ex .src{display:block;font-family:var(--f-ui);font-size:.75rem;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.note{background:var(--card-2);border-radius:10px;padding:10px 12px;font-family:var(--f-read);font-size:.98rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- notebook ---------- */
.nb-item{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.nb-item .w{font-family:var(--f-display);font-size:1.2rem;background:none;border:0;padding:0;color:var(--accent);text-align:left}
.nb-item .t{font-family:var(--f-read);font-size:1.08rem;line-height:1.55;margin:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.04em}
.badge.g{background:var(--good-soft);color:var(--good)}
.badge.h{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.badge.a{background:var(--bad-soft);color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--edge);border-radius:14px}

/* ---------- progress ---------- */
.lvl{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lvl .num{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);font-family:var(--f-display);font-size:1.7rem}
.bar{height:10px;border-radius:999px;background:var(--s0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.heat{overflow-x:auto}
.heat svg{display:block}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-family:var(--f-ui);font-size:11px}
.azmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.azmap div{border-radius:6px 6px 2px 2px;padding:6px 0 4px;text-align:center;font-family:var(--f-display);font-size:1.05rem;background:var(--card);border:1px solid var(--edge);position:relative;overflow:hidden}
.azmap div i{position:absolute;left:0;right:0;bottom:0;background:var(--s3);opacity:.9}
.azmap div span{position:relative}
.azmap div small{display:block;position:relative;font-family:var(--f-ui);font-size:.62rem;color:var(--ink-3)}
.seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.seal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.8rem;color:var(--ink-3)}
.seal .disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--edge);font-family:var(--f-display);font-size:1.5rem;color:var(--ink-3)}
.seal.on .disc{border:3px double var(--rule-red);color:var(--rule-red);background:var(--card)}
.seal.on{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats .fig{padding:12px 14px;background:var(--card);border:1px solid var(--edge);border-radius:12px}
.stats .fig b{font-size:1.8rem}

/* ---------- settings ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field select,.field input[type=number]{min-height:44px;border-radius:10px;border:1.5px solid var(--edge);background:var(--card);padding:6px 10px}
.seg{display:flex;border:1.5px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{flex:1 1 0;min-height:44px;border:0;background:var(--card);padding:8px 14px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.danger{color:var(--bad)}
textarea.backup{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;border-radius:10px;border:1.5px solid var(--edge);background:var(--card);padding:8px}
.syncdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ink-3)}
.syncdot.on{background:var(--good)}
.syncdot.err{background:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--desk);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;box-shadow:0 10px 30px -10px var(--shadow);max-width:calc(100vw - 32px)}
@media (min-width:960px){.toast{bottom:28px}}

@media (max-width:420px){
  .h-screen{font-size:1.7rem}
  .round{gap:12px}
  .round .figs{gap:14px}
  .ring{width:78px;height:78px}
  .fig b{font-size:2rem}
  .fig span{font-size:.7rem;letter-spacing:.05em}
  .btn{padding-inline:16px}
  .icard-head,.icard-body{padding-inline:16px}
  .rate .btn{padding-inline:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

</style>
</head>

first meant ‘in one course’, then ‘at once’, and finally ‘soon’.","pp":"adverb"},{"id":13,"w":"anosmia","f":"anosmic (adj.)","p":"noun","i":"/æˈnɒzmiə/","d":"the loss of the sense of smell, either total or in part","r":"medical","e":"Greek an- ‘without’ + osmē ‘smell’. The metal osmium was named after the same word, for its sharp smell.","s":"parosmia — a distorted sense of smell; phantosmia — smelling things that are not there (both are also in your list)","c":"develop/suffer from anosmia; temporary/permanent anosmia","x":["Anosmia became one of the tell-tale signs of Covid-19, and many patients found the loss strangely close to grief.","Kelly lost her sense of smell after developing sinusitis in 2012, and describes anosmia as ‘like a bereavement’."],"z":["Anosmia","anosmia"],"n":"","t":"science; body","y":1,"g":"the loss of the sense of smell, either total or in part","sy":["parosmia","phantosmia"],"ez":"Greek an- ‘without’ + osmē ‘smell’. The metal osmium was named after the same word, for its sharp smell.","pp":"noun"},{"id":14,"w":"anthropophagi","f":"anthropophagus (sing.); anthropophagite (n.); anthropophagy (n.); anthropophagous (adj.)","p":"noun (plural)","i":"/ˌænθrəˈpɒfəɡaɪ/","d":"people who eat human flesh; cannibals","r":"literary","e":"Latin anthropophagus, from Greek anthrōpophagos ‘eating human flesh’: anthrōpos ‘human’ (as in anthropology) + phagein ‘eat’ (as in oesophagus).","s":"cannibals — the everyday word; man-eaters — used of animals or, luridly, of people","c":"the Anthropophagi (as a named people in old travel tales)","x":["Othello wins Desdemona with tales of ‘the Cannibals that each other eat, / The Anthropophagi’ — exotic horrors that make the storyteller himself seem heroic.","They had been living among anthropophagists, and had joined in their feasts."],"z":["Anthropophagi","anthropophagists"],"n":"You wrote ‘Anthropophagites’. That form exists (singular anthropophagite), but the classical plural anthropophagi is the one used in literature, for example in Othello, Act 1, Scene 3.","t":"literature","y":1,"g":"people who eat human flesh; cannibals","sy":["cannibals","man-eaters"],"ez":"Latin ———, from Greek anthrōpophagos ‘eating human flesh’: anthrōpos ‘human’ (as in anthropology) + phagein ‘eat’ (as in oesophagus).","pp":"noun"},{"id":15,"w":"antiphonal","f":"antiphon (n.); antiphonally (adv.)","p":"adjective","i":"/ænˈtɪfənl/","d":"sung, recited or played alternately by two groups, each answering the other","r":"specialist (music, liturgy); figurative in general writing","e":"From antiphon, from Greek antiphōnos ‘responsive’: anti ‘in return’ + phōnē ‘voice’. ‘Anthem’ is an older borrowing of the same word.","s":"responsive — answering back; call-and-response — the informal name for the pattern; alternating — neutral","c":"antiphonal singing/chant/choirs","x":["On its worst days, parliamentary debate becomes antiphonal chanting: each side’s slogan answered by the other’s, with no argument heard at all.","But then the walls melt and the players sit in a row, reciting an antiphonal prose poem that parodies modern preoccupations."],"z":["antiphonal","antiphonal"],"n":"","t":"literature; music","y":1,"g":"sung, recited or played alternately by two groups, each answering the other","sy":["responsive","call-and-response","alternating"],"ez":"From ———, from Greek antiphōnos ‘responsive’: anti ‘in return’ + phōnē ‘voice’. ‘Anthem’ is an older borrowing of the same word.","pp":"adjective"},{"id":16,"w":"apocryphal","f":"the Apocrypha (n.)","p":"adjective","i":"/əˈpɒkrɪfl/","d":"(of a story) well known, but probably not true","r":"","e":"From Apocrypha, from Greek apokruphos ‘hidden’ (apo ‘away’ + kruptein ‘hide’, as in crypt). It first referred to biblical books of doubtful authority.","s":"legendary — told as tradition, perhaps true; spurious — false or fake, stronger; unverified — not yet proved","c":"an apocryphal story/tale/anecdote; probably/almost certainly apocryphal","x":["The story that Marie Antoinette said ‘Let them eat cake’ is almost certainly apocryphal.","Nobel’s inspiration may be an apocryphal tale, but whether COP 29 influences Azerbaijan’s future legacy is a story that is still unfolding."],"z":["apocryphal","apocryphal"],"n":"","t":"history","y":1,"g":"(of a story) well known, but probably not true","sy":["legendary","spurious","unverified"],"ez":"From ———, from Greek apokruphos ‘hidden’ (apo ‘away’ + kruptein ‘hide’, as in crypt). It first referred to biblical books of doubtful authority.","pp":"adjective"},{"id":17,"w":"apostasy","f":"apostate (n.): a person who does this; apostatize (v.)","p":"noun","i":"/əˈpɒstəsi/","d":"the act of rejecting your former religious or political beliefs","r":"formal","e":"Greek apostasia ‘defection, revolt’: apo ‘away’ + histanai ‘to stand’. Literally, standing away.","s":"defection — leaving a party, cause or country; heresy — holding beliefs contrary to orthodoxy while still inside it; recantation — publicly withdrawing a belief","c":"accused of/charged with apostasy; political apostasy","x":["To the party faithful, any praise for the rival’s economic record was treated as apostasy.","Ibrahim was sentenced to death for ‘apostasy’ last month by a Khartoum court for allegedly converting to Christianity from Islam."],"z":["apostasy","apostasy"],"n":"Your meaning began with ‘a person who has rejected…’, which describes an apostate. Apostasy is the act.","t":"religion; polity","y":1,"g":"the act of rejecting your former religious or political beliefs","sy":["defection","heresy","recantation"],"ez":"Greek apostasia ‘defection, revolt’: apo ‘away’ + histanai ‘to stand’. Literally, standing away.","pp":"noun"},{"id":18,"w":"apotheosis","f":"apotheosize (v.)","p":"noun","i":"/əˌpɒθiˈəʊsɪs/","d":"1. the highest or most perfect development of something 2. the best time in somebody’s life or career 3. a formal statement that a person has become a god","r":"formal","e":"Greek apotheōsis, from apotheoun ‘make a god of’: apo ‘from’ + theos ‘god’ (as in theology).","s":"epitome — a perfect example of a type; zenith/pinnacle — the highest point; deification — sense 3, making somebody a god","c":"the apotheosis of something; reach its apotheosis","x":["For many critics, Paradise Lost is the apotheosis of the English epic.","The city is in many ways a cultural feast, the very apotheosis of hybridity."],"z":["apotheosis","apotheosis"],"n":"","t":"literature","y":1,"g":"the highest or most perfect development of something","sy":["epitome","zenith/pinnacle","deification"],"ez":"Greek apotheōsis, from apotheoun ‘make a god of’: apo ‘from’ + theos ‘god’ (as in theology).","pp":"noun"},{"id":19,"w":"approbation","f":"approbatory (adj.)","p":"noun","i":"/ˌæprəˈbeɪʃn/","d":"approval or agreement","r":"formal","e":"Latin approbare: ad- ‘to’ + probare ‘test, try’ (as in prove, probation).","s":"approval — the plain word; commendation — formal praise; sanction — official permission. Opposite: opprobrium","c":"win/earn/seek approbation; public/official approbation","x":["A civil servant must act on conviction, not in search of the minister’s approbation.","On the floor, Biles’ every routine Tuesday received a studied silence, and every landing received raucous approbation"],"z":["approbation","approbation"],"n":"","t":"ethics","y":1,"g":"approval or agreement","sy":["approval","commendation","sanction"],"ez":"Latin approbare: ad- ‘to’ + probare ‘test, try’ (as in prove, probation).","pp":"noun"},{"id":20,"w":"appurtenance","f":"appurtenant (adj., law)","p":"noun","i":"/əˈpɜːtɪnəns/","d":"a thing that forms a part of something larger or more important","r":"formal or humorous; usually plural","e":"Old French apertenance, from late Latin appertinere ‘belong to’ (ad- + pertinere, as in pertain).","s":"accessory — an extra that adds to something; adjunct — something added but not essential; trappings — the outward signs of status","c":"the appurtenances of power/office/modern life","x":["The red beacon was once an indispensable appurtenance of ministerial office in India.","Spying was an appurtenance of monarchy, and therefore incompatible with republican government."],"z":["appurtenance","appurtenance"],"n":"","t":"polity; law","y":1,"g":"a thing that forms a part of something larger or more important","sy":["accessory","adjunct","trappings"],"ez":"Old French apertenance, from late Latin appertinere ‘belong to’ (ad- + pertinere, as in pertain).","pp":"noun"},{"id":21,"w":"aptronym","f":"aptonym (variant)","p":"noun","i":"/ˈæptrənɪm/","d":"a person’s name that is amusingly appropriate to their job or character","r":"informal, humorous","e":"A blend of apt + patronym.","s":"charactonym — in literature, a name that reveals character, like Dickens’s Gradgrind; nominative determinism — the half-serious idea that names shape careers","c":"a perfect aptronym; collect aptronyms","x":["Dickens needed no aptronyms from life; he invented Gradgrind, Murdstone and Mr Bumble instead.","He began collecting aptronyms when he saw an ad for a flower shop operated by Flora Gardner."],"z":["aptronyms","aptronyms"],"n":"","t":"literature; language","y":1,"g":"a person’s name that is amusingly appropriate to their job or character","sy":["charactonym","nominative determinism"],"ez":"A blend of apt + patronym.","pp":"noun"},{"id":22,"w":"arborescence","f":"arborescent (adj.)","p":"noun","i":"/ˌɑːbəˈresns/","d":"a tree-like form or growth; a branching, tree-like structure","r":"specialist; literary theory","e":"From arborescent, from Latin arborescere ‘grow into a tree’, from arbor ‘tree’ (as in arboretum).","s":"ramification — branching, often of consequences; dendritic — branching, used in science","c":"arborescent structure/model/thought","x":["Deleuze and Guattari set the hierarchical, arborescent model of thought against the sprawling, non-hierarchical rhizome.","The city’s transportation map revealed a strict arborescence, with every route tracing back to a central hub like tributaries to a river."],"z":["arborescent","arborescence"],"n":"Your meaning, ‘resembling a tree…’, defines the adjective arborescent. The noun names the tree-like form itself.","t":"literature; science","y":1,"g":"a tree-like form or growth; a branching, tree-like structure","sy":["ramification","dendritic"],"ez":"From ———, from Latin arborescere ‘grow into a tree’, from arbor ‘tree’ (as in arboretum).","pp":"noun"},{"id":23,"w":"archness","f":"arch (adj.); archly (adv.)","p":"noun","i":"/ˈɑːtʃnəs/","d":"a playful, knowing manner that suggests you are amused by something you know and others do not","r":"literary","e":"From arch (adj.), from the prefix arch- ‘chief’. It was often used in phrases like arch-rogue, so it came to mean ‘roguish’, and later ‘saucy, knowing’.","s":"roguishness — mischievous charm; coyness — pretended shyness; irony — saying one thing and meaning another","c":"an arch smile/look/tone; say something archly","x":["Austen’s narrator speaks with an archness that lets the reader in on jokes the characters never see.","As a visual storyteller, Jefferson is still finding his feet, though there is wit and archness in certain compositions and editing choices."],"z":["archness","archness"],"n":"","t":"literature; character","y":1,"g":"a playful, knowing manner that suggests you are amused by something you know and others do not","sy":["roguishness","coyness","irony"],"ez":"From ——— (adj.), from the prefix ———- ‘chief’. It was often used in phrases like ———-rogue, so it came to mean ‘roguish’, and later ‘saucy, knowing’.","pp":"noun"},{"id":24,"w":"ardour","f":"ardent (adj.); ardently (adv.); US ardor","p":"noun","i":"/ˈɑːdə(r)/","d":"very strong feelings of enthusiasm or love","r":"formal","e":"Latin ardor, from ardere ‘to burn’. Arson comes from the same verb.","s":"fervour — intense feeling, often religious or political; zeal — energetic devotion to a cause; passion — strong emotion, the general word","c":"reforming/revolutionary/patriotic ardour; dampen/cool somebody’s ardour","x":["Reforming ardour tends to cool once a government has its second term in hand.","His reforming ardour is exhausted, and attention is shifting to his successor."],"z":["ardour","ardour"],"n":"","t":"character; polity","y":1,"g":"very strong feelings of enthusiasm or love","sy":["fervour","zeal","passion"],"ez":"Latin ardor, from ardere ‘to burn’. Arson comes from the same verb.","pp":"noun"},{"id":25,"w":"arrogate","f":"arrogation (n.)","p":"verb","i":"/ˈærəɡeɪt/","d":"to claim or take something that you have no right to","r":"formal","e":"Latin arrogare ‘claim for oneself’: ad- + rogare ‘ask’. The same root gives arrogant.","s":"usurp — seize power or a position illegally or by force; appropriate — take for your own use, often without permission; assume — take on, neutral","c":"arrogate something to yourself; arrogate powers/rights/authority","x":["An executive that arrogates to itself the powers of the legislature invites the courts to intervene.","I do not arrogate to myself the right to decide."],"z":["arrogates","arrogate"],"n":"You marked it as a phrasal verb. It is an ordinary verb, usually in the pattern ‘arrogate something to yourself’.","t":"polity; law","y":1,"g":"to claim or take something that you have no right to","sy":["usurp","appropriate","assume"],"ez":"Latin arrogare ‘claim for oneself’: ad- + rogare ‘ask’. The same root gives arrogant.","pp":"verb"},{"id":26,"w":"aspersions","f":"aspersion (sing., rare)","p":"noun (usually plural)","i":"/əˈspɜːʃnz/","d":"critical or unpleasant remarks or judgements","r":"formal","e":"Latin aspergere ‘sprinkle’ (ad- + spargere). It first meant sprinkling holy water; now it is dirt sprinkled on a person’s name.","s":"slur — an insulting remark that damages a reputation; calumny — a false statement meant to damage, formal; innuendo — an indirect, sly hint","c":"cast aspersions on somebody/something","x":["It is irresponsible to cast aspersions on the integrity of an institution without a shred of evidence."],"z":["aspersions"],"n":"The example in your list was a pasted copy of the Ardour sentence, so I removed it.","t":"speech; polity","y":0,"g":"critical or unpleasant remarks or judgements","sy":["slur","calumny","innuendo"],"ez":"Latin aspergere ‘sprinkle’ (ad- + spargere). It first meant sprinkling holy water; now it is dirt sprinkled on a person’s name.","pp":"noun"},{"id":27,"w":"asphyxiation","f":"asphyxiate (v.); asphyxia (n.)","p":"noun","i":"/əsˌfɪksiˈeɪʃn/","d":"the fact of being prevented from breathing until you become unconscious or die; the act of preventing somebody from breathing","r":"","e":"Greek asphyxia ‘stopping of the pulse’: a- ‘without’ + sphyzein ‘to throb’.","s":"suffocation — the general word; strangulation — by pressure on the throat; choking — blockage of the airway","c":"die of/from asphyxiation; the asphyxiation of dissent (figurative)","x":["Workers still die of asphyxiation in septic tanks, decades after manual scavenging was outlawed.","Two workers died of asphyxiation at a chemical manufacturing unit in Mangrol of Surat district on Saturday while cleaning a reactor tank."],"z":["asphyxiation","asphyxiation"],"n":"","t":"society; body","y":1,"g":"the fact of being prevented from breathing until you become unconscious or die; the act of preventing somebody from breathing","sy":["suffocation","strangulation","choking"],"ez":"Greek ——— ‘stopping of the pulse’: a- ‘without’ + sphyzein ‘to throb’.","pp":"noun"},{"id":28,"w":"assiduous","f":"assiduously (adv.); assiduity (n.)","p":"adjective","i":"/əˈsɪdʒuəs/","d":"working very hard and taking great care that everything is done as well as it can be","r":"formal","e":"Latin assiduus, from assidere ‘sit by, be busy at’: ad- + sedere ‘sit’ (as in sedentary). Literally, sitting at the task.","s":"diligent — careful and hard-working, neutral; sedulous — persistent and painstaking, literary; industrious — hard-working in general","c":"assiduous attention/care/efforts; assiduously cultivated","x":["Assiduous note-making in the first year pays compound interest in the last month before the exam."],"z":["Assiduous"],"n":"","t":"character","y":0,"g":"working very hard and taking great care that everything is done as well as it can be","sy":["diligent","sedulous","industrious"],"ez":"Latin assiduus, from assidere ‘sit by, be busy at’: ad- + sedere ‘sit’ (as in sedentary). Literally, sitting at the task.","pp":"adjective"},{"id":29,"w":"astir","f":"","p":"adjective (not before a noun)","i":"/əˈstɜː(r)/","d":"1. awake and out of bed 2. in a state of excited activity","r":"literary","e":"a- ‘on’ + stir, from the Scottish phrase on the stir (first recorded 1799).","s":"up and about — informal; bustling — full of busy activity; abuzz — full of talk or excitement","c":"early astir; the whole town was astir","x":["By dawn the whole village was astir, the drums announcing that the procession would soon begin."],"z":["astir"],"n":"","t":"literature","y":0,"g":"awake and out of bed","sy":["up and about","bustling","abuzz"],"ez":"a- ‘on’ + stir, from the Scottish phrase on the stir (first recorded 1799).","pp":"adjective"},{"id":30,"w":"asunder","f":"","p":"adverb","i":"/əˈsʌndə(r)/","d":"into pieces; apart","r":"old-fashioned or literary","e":"Old English on sundran ‘into a separate place’. Compare the verb sunder.","s":"apart — the plain word; in two; to pieces","c":"tear/rip/rend asunder; put asunder","x":["Partition tore asunder communities that had lived side by side for centuries."],"z":["asunder"],"n":"","t":"literature; history","y":0,"g":"into pieces; apart","sy":["apart","in two","to pieces"],"ez":"Old English on sundran ‘into a separate place’. Compare the verb sunder.","pp":"adverb"},{"id":31,"w":"atavistic","f":"atavism (n.)","p":"adjective","i":"/ˌætəˈvɪstɪk/","d":"related to the feelings, attitudes and behaviour of humans in ancient times that have been passed on to modern humans as a habit or instinct","r":"formal","e":"Latin atavus ‘forefather’ + -istic.","s":"primal — basic and primitive, belonging to the earliest stage; ancestral — inherited from ancestors; tribal — loyal to one’s own group, often disapproving","c":"atavistic fear/urge/instinct/impulse","x":["Communal violence draws on atavistic fears that no index of literacy or income can fully explain."],"z":["atavistic"],"n":"","t":"society; psychology","y":0,"g":"related to the feelings, attitudes and behaviour of humans in ancient times that have been passed on to modern humans as a habit or instinct","sy":["primal","ancestral","tribal"],"ez":"Latin atavus ‘forefather’ + -istic.","pp":"adjective"},{"id":32,"w":"attenuate","f":"attenuated (adj.); attenuation (n.)","p":"verb","i":"/əˈtenjueɪt/","d":"to make something weaker or less effective","r":"formal","e":"Latin attenuare ‘make thin’: ad- + tenuare, from tenuis ‘thin’. Tenuous comes from the same root.","s":"weaken — neutral; dilute — reduce strength by adding something; diminish — make smaller or less","c":"attenuate the effect/impact/risk; an attenuated vaccine; attenuated link","x":["Every layer of bureaucracy between Delhi and the village attenuates the effect of a welfare scheme."],"z":["attenuates"],"n":"","t":"polity; science","y":0,"g":"to make something weaker or less effective","sy":["weaken","dilute","diminish"],"ez":"Latin attenuare ‘make thin’: ad- + tenuare, from tenuis ‘thin’. Tenuous comes from the same root.","pp":"verb"},{"id":33,"w":"autarky","f":"autarkic (adj.)","p":"noun","i":"/ˈɔːtɑːki/","d":"economic self-sufficiency, especially a national policy of doing without foreign trade","r":"formal; economics","e":"Greek autarkeia ‘self-sufficiency’: autos ‘self’ + arkein ‘suffice’.","s":"self-sufficiency — the plain word; import substitution — a policy of making at home what was imported; protectionism — shielding home industry with tariffs, not the same as doing without trade","c":"economic autarky; a policy of autarky","x":["Atmanirbhar Bharat, its defenders insist, is about resilience, not autarky."],"z":["autarky"],"n":"Do not confuse it with autarchy, which means absolute rule.","t":"economy","y":0,"g":"economic self-sufficiency, especially a national policy of doing without foreign trade","sy":["self-sufficiency","import substitution","protectionism"],"ez":"Greek autarkeia ‘self-sufficiency’: autos ‘self’ + arkein ‘suffice’.","pp":"noun"},{"id":34,"w":"autecology","f":"autecological (adj.)","p":"noun","i":"/ˌɔːtɪˈkɒlədʒi/","d":"the study of how an individual organism or a single species relates to its environment","r":"specialist (ecology)","e":"German Autökologie: aut(o)- ‘self’ + Ökologie ‘ecology’. It is contrasted with synecology, the study of whole communities.","s":"synecology — its opposite, the ecology of communities; population ecology — the study of groups of one species","c":"the autecology of a species; autecological studies","x":["The autecology of the Great Indian Bustard — its heavy, low flight and poor forward vision — explains why power lines kill so many.","Autecology can help us be better prepared for the effects of climate change on the animal kingdom."],"z":["autecology","Autecology"],"n":"","t":"science; environment","y":1,"g":"the study of how an individual organism or a single species relates to its environment","sy":["population ecology"],"ez":"German Autökologie: aut(o)- ‘self’ + Ökologie ‘ecology’. It is contrasted with synecology, the study of whole communities.","pp":"noun"},{"id":35,"w":"autochthonous","f":"autochthon (n.)","p":"adjective","i":"/ɔːˈtɒkθənəs/","d":"1. (of people) whose ancestors have always lived in the same place; indigenous 2. (of rock, or figuratively of a tradition) formed or originating in the place where it is found","r":"specialist","e":"Greek autokhthōn ‘sprung from the land itself’: autos ‘self’ + khthōn ‘earth’ (as in chthonic).","s":"indigenous — native to a place, the standard word; aboriginal — the earliest known inhabitants; native — born in or belonging to a place","c":"autochthonous people/communities/tradition","x":["Critics once dismissed Indian writing in English as derivative; few would now deny it an autochthonous voice of its own."],"z":["autochthonous"],"n":"","t":"society; literature","y":0,"g":"(of people) whose ancestors have always lived in the same place; indigenous","sy":["indigenous","aboriginal","native"],"ez":"Greek autokhthōn ‘sprung from the land itself’: autos ‘self’ + khthōn ‘earth’ (as in chthonic).","pp":"adjective"},{"id":36,"w":"autopoiesis","f":"autopoietic (adj.)","p":"noun","i":"/ˌɔːtəʊpɔɪˈiːsɪs/","d":"the ability of a system, such as a living cell, to produce, maintain and renew itself","r":"specialist (biology, systems theory)","e":"Coined by the biologists Humberto Maturana and Francisco Varela: auto- ‘self’ + Greek poiēsis ‘making’ (as in poetry).","s":"self-organization — order arising from within a system; self-replication — making copies of itself","c":"autopoietic system; the concept of autopoiesis","x":["Niklas Luhmann borrowed autopoiesis from biology to describe law as a system that reproduces itself through its own operations.","Characters formed words and commands in a string. The string ate its own tail and learned to rewrite itself. These were the early days of autopoiesis, the writing that writes itself."],"z":["autopoiesis","autopoiesis"],"n":"","t":"science; theory","y":1,"g":"the ability of a system, such as a living cell, to produce, maintain and renew itself","sy":["self-organization","self-replication"],"ez":"Coined by the biologists Humberto Maturana and Francisco Varela: auto- ‘self’ + Greek poiēsis ‘making’ (as in poetry).","pp":"noun"},{"id":37,"w":"beatific","f":"beatifically (adv.); beatitude (n.)","p":"adjective","i":"/ˌbiːəˈtɪfɪk/","d":"showing great joy and peace","r":"formal","e":"French béatifique or Latin beatificus, from beatus ‘blessed’ (as in beatitude).","s":"serene — calm and untroubled; blissful — extremely happy; seraphic — angelic in beauty or calm","c":"a beatific smile/expression; the beatific vision (theology)","x":["The seated Buddha of Sarnath wears a beatific half-smile that seems to have outlasted every empire around it."],"z":["beatific"],"n":"","t":"art; religion","y":0,"g":"showing great joy and peace","sy":["serene","blissful","seraphic"],"ez":"French béatifique or Latin beatificus, from beatus ‘blessed’ (as in ———).","pp":"adjective"},{"id":38,"w":"bedazzle","f":"bedazzled (adj.); bedazzlement (n.)","p":"verb","i":"/bɪˈdæzl/","d":"to impress somebody very much with intelligence, beauty, etc.","r":"usually passive","e":"be- (intensive) + dazzle.","s":"dazzle — impress or blind with brightness; enthral — hold completely spellbound; overawe — impress so much that one is subdued","c":"be bedazzled by somebody/something","x":["Voters bedazzled by new expressways may not notice what has happened to the district hospital.","In an age of book tours, signings and authors taking to social media to engage with their readers, Ferrante’s decision to remain anonymous is bewildering and bedazzling."],"z":["bedazzled","bedazzling"],"n":"","t":"everyday","y":1,"g":"to impress somebody very much with intelligence, beauty, etc","sy":["dazzle","enthral","overawe"],"ez":"be- (intensive) + dazzle.","pp":"verb"},{"id":39,"w":"begrime","f":"begrimed (adj.)","p":"verb","i":"/bɪˈɡraɪm/","d":"to make something dirty with soot, dust or grime","r":"literary","e":"be- ‘thoroughly’ + grime (first recorded in the 1530s).","s":"soil — make dirty, formal; sully — damage purity or reputation (figurative); besmirch — damage a reputation","c":"begrimed with soot/dust/coal","x":["The miners emerged begrimed with coal dust, their eyes startlingly white."],"z":["begrimed"],"n":"","t":"literature","y":0,"g":"to make something dirty with soot, dust or grime","sy":["soil","sully","besmirch"],"ez":"be- ‘thoroughly’ + grime (first recorded in the 1530s).","pp":"verb"},{"id":40,"w":"beguile","f":"beguiling (adj.); beguilingly (adv.)","p":"verb","i":"/bɪˈɡaɪl/","d":"1. to trick somebody into doing something, especially by being nice to them 2. to attract or interest somebody","r":"formal","e":"be- ‘thoroughly’ + obsolete guile ‘to deceive’. It first meant ‘deceive, cheat’.","s":"charm — attract pleasantly; cajole — coax by flattery; inveigle — trick somebody into doing something (also in your list)","c":"a beguiling smile/simplicity; beguile somebody into doing something","x":["The manifesto’s promises were beguiling in their simplicity and silent on their cost."],"z":["beguiling"],"n":"","t":"character; speech","y":0,"g":"to trick somebody into doing something, especially by being nice to them","sy":["charm","cajole","inveigle"],"ez":"be- ‘thoroughly’ + obsolete guile ‘to deceive’. It first meant ‘deceive, cheat’.","pp":"verb"},{"id":41,"w":"behoof","f":"","p":"noun","i":"/bɪˈhuːf/","d":"benefit or advantage, usually in the phrase ‘for/to somebody’s behoof’","r":"archaic","e":"Old English behōf ‘profit, need’. It is the root of behove.","s":"benefit — the plain word; advantage; interest — as in ‘in the public interest’","c":"for the behoof of somebody; to his behoof","x":["Laws framed for the behoof of a few, the early nationalists argued, could not command the loyalty of the many."],"z":["behoof"],"n":"","t":"literature; history","y":0,"g":"benefit or advantage, usually in the phrase ‘for/to somebody’s behoof’","sy":["benefit","advantage","interest"],"ez":"Old English behōf ‘profit, need’. It is the root of behove.","pp":"noun"},{"id":42,"w":"behove","f":"US behoove","p":"verb","i":"/bɪˈhəʊv/","d":"it is right or necessary for somebody to do something","r":"formal","e":"Old English behōfian, from behōf ‘benefit, need’ (see behoof).","s":"befit — be suitable for; be incumbent on — be the duty of; ought to — the plain modal","c":"it behoves somebody to do something","x":["It behoves a public servant to avoid even the appearance of partiality.","It does not behove a great and independent nation such as India to allow the West’s anti-China narratives to shape the Indian media’s and academia’s — hence our people’s — thinking about its neighbour."],"z":["behoves","behove"],"n":"It is used almost only in the pattern ‘it behoves somebody to…’.","t":"ethics","y":1,"g":"it is right or necessary for somebody to do something","sy":["befit","be incumbent on","ought to"],"ez":"Old English behōfian, from behōf ‘benefit, need’ (see behoof).","pp":"verb"},{"id":43,"w":"belabour","f":"US belabor","p":"verb","i":"/bɪˈleɪbə(r)/","d":"to repeat an idea, argument, etc. many times to emphasize it, especially when it has already been mentioned or understood","r":"formal","e":"be- + labour. An older sense is ‘to beat thoroughly’.","s":"harp on — keep talking about, annoyingly; labour the point — the same idea, less formal; overstate — make something seem more important than it is","c":"belabour the point/obvious","x":["I shall not belabour the point: the data speak for themselves.","She tends to belabour every minor point in meetings, turning a 10-minute discussion into an hour-long ordeal."],"z":["belabour","belabour"],"n":"","t":"speech","y":1,"g":"to repeat an idea, argument, etc. many times to emphasize it, especially when it has already been mentioned or understood","sy":["harp on","labour the point","overstate"],"ez":"be- + labour. An older sense is ‘to beat thoroughly’.","pp":"verb"},{"id":44,"w":"beleaguered","f":"beleaguer (v.)","p":"adjective","i":"/bɪˈliːɡəd/","d":"1. experiencing a lot of criticism and difficulties 2. surrounded by an enemy","r":"formal","e":"Dutch belegeren ‘camp round’: be- ‘around’ + leger ‘camp’.","s":"embattled — under constant attack or criticism; besieged — surrounded by armed forces; harried — harassed by repeated demands","c":"a beleaguered government/minister/regulator/city","x":["The beleaguered regulator found itself criticized by investors and ministers alike."],"z":["beleaguered"],"n":"","t":"polity","y":0,"g":"experiencing a lot of criticism and difficulties","sy":["embattled","besieged","harried"],"ez":"Dutch belegeren ‘camp round’: be- ‘around’ + leger ‘camp’.","pp":"adjective"},{"id":45,"w":"bellicose","f":"bellicosity (n.)","p":"adjective","i":"/ˈbelɪkəʊs/","d":"having or showing a desire to argue or fight","r":"formal","e":"Latin bellicosus, from bellum ‘war’ (as in antebellum and rebel).","s":"belligerent — actively hostile, or legally at war; pugnacious — eager to fight, often in personal quarrels; hawkish — favouring military action in policy","c":"bellicose rhetoric/statements/posture","x":["Bellicose rhetoric in election season can box governments into positions that diplomacy later struggles to unwind.","He calculates that a new regime is likely to be less tyrannical, less bellicose and less wedded to a nuclear programme."],"z":["Bellicose","bellicose"],"n":"","t":"IR; conflict","y":1,"g":"having or showing a desire to argue or fight","sy":["belligerent","pugnacious","hawkish"],"ez":"Latin bellicosus, from bellum ‘war’ (as in antebellum and rebel).","pp":"adjective"},{"id":46,"w":"belligerent","f":"belligerence (n.); belligerently (adv.); belligerent (n.): a country or group at war","p":"adjective; noun","i":"/bəˈlɪdʒərənt/","d":"1. aggressive and unfriendly; hostile 2. (of a country) fighting a war","r":"sense 2 formal","e":"Latin belligerare ‘wage war’: bellum ‘war’ + gerere ‘wage, carry on’.","s":"bellicose — having a desire to fight; combative — ready to argue or fight; hostile — unfriendly, the general word","c":"belligerent tone/stance; the belligerents; belligerent nations","x":["Common Article 3 of the Geneva Conventions binds all belligerents in a civil war, rebels included.","Emboldened by his victory in the U.S. presidential polls, Donald Trump has drummed up his rhetoric of belligerence by announcing plans to annex Canada and Greenland and retake control of the Panama Canal.","While several attempts have been made by Saudi Arabia, the U.S., the Intergovernmental Authority on Development (IGAD), and the African Union to arrange a ceasefire, none has succeeded largely due to the obduracy of the recalcitrant belligerents."],"z":["belligerents","belligerence","belligerents"],"n":"","t":"IR; conflict; law","y":2,"g":"aggressive and unfriendly; hostile","sy":["bellicose","combative","hostile"],"ez":"Latin belligerare ‘wage war’: bellum ‘war’ + gerere ‘wage, carry on’.","pp":"adjective"},{"id":47,"w":"bemuse","f":"bemused (adj.); bemusement (n.)","p":"verb","i":"/bɪˈmjuːz/","d":"to puzzle or confuse somebody","r":"","e":"be- ‘make, cause’ + muse ‘be absorbed in thought’ (recorded by 1735).","s":"bewilder — confuse completely; perplex — puzzle, often intellectually; nonplus — surprise so much that one cannot react","c":"a bemused expression/look; bemused by something","x":["The minister looked bemused when asked about a report he had evidently not read."],"z":["bemused"],"n":"Bemused means puzzled, not mildly amused. The two are often confused.","t":"everyday","y":0,"g":"to puzzle or confuse somebody","sy":["bewilder","perplex","nonplus"],"ez":"be- ‘make, cause’ + muse ‘be absorbed in thought’ (recorded by 1735).","pp":"verb"},{"id":48,"w":"besmirch","f":"","p":"verb","i":"/bɪˈsmɜːtʃ/","d":"to damage the opinion that people have of somebody/something","r":"formal","e":"be- ‘make, cause’ + smirch ‘to stain’ (first recorded 1604).","s":"sully — spoil the purity of; tarnish — dull a reputation gradually; defame — damage a reputation with false statements, legal","c":"besmirch somebody’s name/reputation/honour","x":["A single leaked clip was enough to besmirch a reputation built over thirty years.","It takes just a mention of contemporary India for her to express in a gentle tone how acutely disappointed she is with the way India is shaping up and how divisive forces are besmirching the nation’s fair name in the global community."],"z":["besmirch","besmirching"],"n":"","t":"ethics; speech","y":1,"g":"to damage the opinion that people have of somebody/something","sy":["sully","tarnish","defame"],"ez":"be- ‘make, cause’ + smirch ‘to stain’ (first recorded 1604).","pp":"verb"},{"id":49,"w":"bivouac","f":"bivouac (v.): bivouacked, bivouacking","p":"noun; verb","i":"/ˈbɪvuæk/","d":"a temporary camp or shelter, without a tent, that is made and used especially by people climbing mountains or by soldiers","r":"","e":"French, probably from Swiss German Bîwacht ‘additional night guard’. It first meant an army’s night watch.","s":"encampment — a camp, often military; camp — the general word","c":"make/set up a bivouac; bivouac for the night","x":["The expedition bivouacked on a narrow ledge below the summit, too exhausted to pitch tents."],"z":["bivouacked"],"n":"","t":"conflict; travel","y":0,"g":"a temporary camp or shelter, without a tent, that is made and used especially by people climbing mountains or by soldiers","sy":["encampment","camp"],"ez":"French, probably from Swiss German Bîwacht ‘additional night guard’. It first meant an army’s night watch.","pp":"noun"},{"id":50,"w":"blitzkrieg","f":"blitz (n., v.)","p":"noun","i":"/ˈblɪtskriːɡ/","d":"a sudden military attack intended to win a quick victory; (figurative) any sudden, intense campaign","r":"","e":"German, literally ‘lightning war’ (Blitz ‘lightning’ + Krieg ‘war’), from the Second World War.","s":"onslaught — a fierce attack; offensive — a planned attack; blitz — a short, intense effort","c":"a media/advertising/social-media blitzkrieg","x":["The party’s social-media blitzkrieg in the final week overwhelmed a slower-moving Opposition."],"z":["blitzkrieg"],"n":"","t":"conflict; history","y":0,"g":"a sudden military attack intended to win a quick victory; (figurative) any sudden, intense campaign","sy":["onslaught","offensive","blitz"],"ez":"German, literally ‘lightning war’ (——— ‘lightning’ + Krieg ‘war’), from the Second World War.","pp":"noun"},{"id":51,"w":"boisterous","f":"boisterously (adv.)","p":"adjective","i":"/ˈbɔɪstərəs/","d":"(of people, animals or behaviour) noi  wheelchair-bound."],"z":["brouhaha","brouhaha"],"n":"","t":"society","y":1,"g":"noisy excitement or complaints about something","sy":["furore","hullabaloo","storm in a teacup"],"ez":"French, probably imitating the sound of a crowd.","pp":"noun"},{"id":54,"w":"browbeat","f":"browbeat, browbeaten, browbeating","p":"verb","i":"/ˈbraʊbiːt/","d":"to frighten or threaten somebody in order to make them do something; to intimidate","r":"","e":"brow + beat: to bear down on somebody with a frowning look (late 16th century).","s":"intimidate — frighten into doing something; bully — use strength or power to harm or frighten; coerce — force by threats, formal and legal","c":"browbeat somebody into doing something; browbeat a witness","x":["Witnesses must not be browbeaten into changing their testimony, whoever is asking the questions."],"z":["browbeaten"],"n":"","t":"law; conflict","y":0,"g":"to frighten or threaten somebody in order to make them do something; to intimidate","sy":["intimidate","bully","coerce"],"ez":"brow + beat: to bear down on somebody with a frowning look (late 16th century).","pp":"verb"},{"id":55,"w":"bucolic","f":"bucolic (n.): a pastoral poem","p":"adjective","i":"/bjuːˈkɒlɪk/","d":"connected with the countryside or country life","r":"literary","e":"Latin from Greek boukolikos, from boukolos ‘herdsman’, from bous ‘ox’. Virgil’s Eclogues are also known as the Bucolics.","s":"pastoral — idealized country life, and a literary genre; rustic — simple and rural, sometimes crude; idyllic — perfectly happy and peaceful","c":"bucolic charm/setting/idyll/landscape","x":["Premchand strips the Indian village of its bucolic charm and shows the debt, hunger and caste beneath."],"z":["bucolic"],"n":"","t":"literature","y":0,"g":"connected with the countryside or country life","sy":["pastoral","rustic","idyllic"],"ez":"Latin from Greek boukolikos, from boukolos ‘herdsman’, from bous ‘ox’. Virgil’s Eclogues are also known as the ———.","pp":"adjective"},{"id":56,"w":"bullyrag","f":"ballyrag (variant)","p":"verb","i":"/ˈbʊliræɡ/","d":"to bully or harass somebody, often by rough teasing","r":"informal, dated","e":"Of unknown origin (first recorded around 1790).","s":"harass — trouble somebody repeatedly; badger — pester persistently; torment — cause great suffering, often deliberately","c":"bullyrag somebody into doing something","x":["Senior students who bullyrag freshers now risk expulsion under the anti-ragging regulations."],"z":["bullyrag"],"n":"","t":"society","y":0,"g":"to bully or harass somebody, often by rough teasing","sy":["harass","badger","torment"],"ez":"Of unknown origin (first recorded around 1790).","pp":"verb"},{"id":57,"w":"bungle","f":"bungler (n.); bungling (adj., n.)","p":"verb; noun","i":"/ˈbʌŋɡl/","d":"to do something badly or without skill; to fail at something","r":"","e":"Of unknown origin (mid 16th century); compare bumble.","s":"botch — do badly, informal; mishandle — deal with badly, neutral; fumble — handle clumsily, often a single moment","c":"bungle a job/raid/rescue/operation; a bungled attempt","x":["The rescue was bungled from the start: the wrong equipment arrived and orders contradicted one another."],"z":["bungled"],"n":"","t":"everyday; polity","y":0,"g":"to do something badly or without skill; to fail at something","sy":["botch","mishandle","fumble"],"ez":"Of unknown origin (mid 16th century); compare bumble.","pp":"verb"},{"id":58,"w":"burgher","f":"","p":"noun","i":"/ˈbɜːɡə(r)/","d":"a citizen of a particular town, especially a respectable middle-class one","r":"old use or humorous","e":"From burgh (borough), reinforced by Dutch burger, from burg ‘castle, fortified town’. Bourgeois comes from the same root.","s":"citizen — the neutral word; townsman — an inhabitant of a town; bourgeois — middle-class, often with a critical edge","c":"solid/prosperous/respectable burghers","x":["Rembrandt’s sober burghers in black coats embody the confidence of a new commercial class."],"z":["burghers"],"n":" ngry (also in your list); curmudgeonly — bad-tempered and grumbling, often of the old; querulous — complaining in a whining way","c":"a cantankerous old man/judge/colleague","x":["A cantankerous judge, he was feared by the Bar and loved by litigants who had waited years for a hearing."],"z":["cantankerous"],"n":"","t":"character","y":0,"g":"often angry; always complaining","sy":["irascible","curmudgeonly","querulous"],"ez":"Of unknown origin (mid 18th century); perhaps a blend of Anglo-Irish cant ‘auction’ and rancorous.","pp":"adjective"},{"id":62,"w":"capricious","f":"capriciously (adv.); caprice (n.)","p":"adjective","i":"/kəˈprɪʃəs/","d":"1. showing sudden changes in attitude or behaviour; unpredictable 2. changing suddenly and quickly","r":"formal","e":"French capricieux, from Italian capriccio, literally ‘head with the hair standing on end’, later ‘a sudden start’, influenced by capra ‘goat’ and its frisky leaps.","s":"fickle — changing loyalties or affections easily; whimsical — playfully unusual; arbitrary — not based on reason, the key legal word","c":"capricious decision/weather/ruler; arbitrary and capricious","x":["Investment dries up when tax policy is capricious, however generous any single concession may be."],"z":["capricious"],"n":"","t":"character; economy","y":0,"g":"showing sudden changes in attitude or behaviour; unpredictable","sy":["fickle","whimsical","arbitrary"],"ez":"French capricieux, from Italian capriccio, literally ‘head with the hair standing on end’, later ‘a sudden start’, influenced by capra ‘goat’ and its frisky leaps.","pp":"adjective"},{"id":63,"w":"careworn","f":"","p":"adjective","i":"/ˈkeəwɔːn/","d":"looking tired because you have a lot of worries","r":"","e":"care + worn.","s":"haggard — looking exhausted and ill; drawn — tired and strained in the face; weary — very tired","c":"careworn face/expression/mother","x":["Her careworn face told of a decade spent caring for a disabled son alone."],"z":["careworn"],"n":"","t":"body; literature","y":0,"g":"looking tired because you have a lot of worries","sy":["haggard","drawn","weary"],"ez":"care + worn.","pp":"adjective"},{"id":64,"w":"carrion","f":"","p":"noun","i":"/ˈkæriən/","d":"the decaying bodies of dead animals","r":"","e":"Old Northern French caroine, based on Latin caro ‘flesh’ (as in carnal, carnivore).","s":"carcass — the dead body of an animal; remains — what is left of a body","c":"feed on carrion; carrion crow","x":["Vultures, which once cleared India’s carrion, were nearly wiped out by the veterinary drug diclofenac."],"z":["carrion"],"n":"","t":"environment","y":0,"g":"the decaying bodies of dead animals","sy":["carcass","remains"],"ez":"Old Northern French caroine, based on Latin caro ‘flesh’ (as in carnal, carnivore).","pp":"noun"},{"id":65,"w":"castigate","f":"castigation (n.)","p":"verb","i":"/ˈkæstɪɡeɪt/","d":"to criticize somebody/something/yourself severely","r":"formal","e":"Latin castigare ‘reprove’, from castus ‘pure’: to make pure by correction.","s":"reprimand — rebuke formally, often officially; berate — scold angrily; excoriate — criticize very severely (also in your list)","c":"castigate somebody for something; be castigated by the court/committee","x":["The committee castigated the ministry for sitting on the funds while the drought worsened.","Castigating the practice of decrying former judges, Justice Nagarathna underscored that one must not lose sight of the times in which judges like Justice Iyer discharged their duties including the socio-economic policies that the state pursued at that time."],"z":["castigated","Castigating"],"n":"","t":"polity; speech","y":1,"g":"to criticize somebody/something/yourself severely","sy":["reprimand","berate","excoriate"],"ez":"Latin castigare ‘reprove’, from castus ‘pure’: to make pure by correction.","pp":"verb"},{"id":66,"w":"casus belli","f":"plural: casus belli","p":"noun","i":"/ˌkɑːsʊs ˈbeliː/","d":"an act or situation that is used to justify a war","r":"formal","e":" ething","x":["The clamour for a caste census grew louder with every state election."],"z":["clamour"],"n":"","t":"polity; society","y":0,"g":"a loud noise, especially one made by many people; a loud demand made by many people","sy":["outcry","uproar","din"],"ez":"Latin clamor, from clamare ‘cry out’ (as in exclaim, proclaim).","pp":"noun"},{"id":78,"w":"clasp","f":"clasp (n.): a fastening device; a firm hold","p":"verb; noun","i":"/klɑːsp/","d":"1. to hold something tightly in your hand 2. to hold somebody/something tightly with your arms around them 3. to fasten something with a clasp","r":"formal","e":"Middle English, of unknown origin.","s":"grip — hold tightly; clutch — hold tightly, often from fear; grasp — seize and hold","c":"clasp hands; clasp somebody to your chest; hands clasped in prayer","x":["The two leaders clasped hands for the cameras, though the talks had yielded little."],"z":["clasped"],"n":"","t":"everyday; IR","y":0,"g":"to hold something tightly in your hand","sy":["grip","clutch","grasp"],"ez":"Middle English, of unknown origin.","pp":"verb"},{"id":79,"w":"clinch","f":"clincher (n.); clinching (adj.)","p":"verb; noun","i":"/klɪntʃ/","d":"1. to succeed in achieving or winning something 2. to provide the answer to something; to settle something that was not certain","r":"informal","e":"A variant of clench.","s":"secure — obtain after effort; seal — make certain, as in ‘seal a deal’; settle — resolve","c":"clinch a deal/victory/title/argument; the clinching argument","x":["A late surge in rural votes clinched the election for the incumbent."],"z":["clinched"],"n":"","t":"everyday; polity","y":0,"g":"to succeed in achieving or winning something","sy":["secure","seal","settle"],"ez":"A variant of clench.","pp":"verb"},{"id":80,"w":"cloistered","f":"cloister (n.)","p":"adjective","i":"/ˈklɔɪstəd/","d":"protected from the problems and dangers of normal life","r":"formal","e":"From cloister, a covered walk in a monastery, from Latin claustrum ‘enclosure’, from claudere ‘shut’ (as in claustrophobia).","s":"sheltered — protected from difficulties; secluded — hidden away; insular — narrow in outlook (also in your list)","c":"a cloistered life/existence/world of academia","x":["Policy made in cloistered offices often misjudges life in a district hospital.","Unfortunately, the imagination of community re-entry pathways for those living long term in psychiatric facilities remains cloistered: in semi-institutional or trans-institutional options that transfer their custodial existence from one place to another."],"z":["cloistered","cloistered"],"n":"","t":"society","y":1,"g":"protected from the problems and dangers of normal life","sy":["sheltered","secluded","insular"],"ez":"From ———, a covered walk in a monastery, from Latin claustrum ‘enclosure’, from claudere ‘shut’ (as in claustrophobia).","pp":"adjective"},{"id":81,"w":"coagulation","f":"coagulate (v.)","p":"noun","i":"/kəʊˌæɡjuˈleɪʃn/","d":"the process by which a liquid, especially blood, becomes thick and partly solid","r":"specialist","e":"Latin coagulare ‘curdle’, from coagulum ‘rennet’.","s":"clotting — the everyday word, especially for blood; curdling — of milk; congealing — of fat or blood as it cools","c":"blood coagulation; coagulation disorder","x":["Russell’s viper venom disrupts coagulation, which is why bites can cause uncontrolled bleeding."],"z":["coagulation"],"n":"","t":"science; body","y":0,"g":"the process by which a liquid, especially blood, becomes thick and partly solid","sy":["clotting","curdling","congealing"],"ez":"Latin coagulare ‘curdle’, from coagulum ‘rennet’.","pp":"noun"},{"id":82,"w":"coeval","f":"coeval (n.): a person of the same age","p":"adjective; noun","i":"/kəʊˈiːvl/","d":"(of two or more things) being the same age or having the same date of origin","r":"formal","e":"Late Latin coaevus: co- ‘together’ + aevum ‘age’ (as in medieval, longevity).","s":"contemporary — living or happening at the same time; contemporaneous — existing at the same period, formal; simultaneous — at exactly the same moment","c":"coeval with something","x":["The Harappan cities were roughly coeval with those of Mesopotamia and Old Kingdom Egypt."],"z":["coeval"],"n":"","t":"history","y":0,"g":"(of two or more things) being the same age or having the same date of origin","sy":["contemporary","contemporaneous","simultaneous"],"ez":"Late Latin coaevus: co- ‘together’ + aevum ‘age’ (as in medieval, longevity).","pp":"adjective"},{"id":83,"w":"coiffure","f":"coiffed (adj.)","p":"noun","i":"/kwɑːˈfjʊə(r)/","d":"the way in which a person’s hair is arranged","r":"formal or humorous","e":"French, from coiffer ‘arrange the hair’, from coife ‘headdress’.","s":"hairstyle — the neutral word; hairdo — informal; coif — short form","c":"an elaborate/immaculate coiffure","x":["Not a strand of the anchor’s coiffure moved as she read out news of the cyclone."],"z":["coiffure"],"n":"","t":"everyday","y":0,"g":"the way in which a person’s hair is arranged","sy":["hairstyle","hairdo","coif"],"ez":"French, from coiffer ‘arrange the hair’, from coife ‘headdress’.","pp":"noun"},{"id":84,"w":"comeuppance","f":"","p":"noun","i":"/kʌmˈʌpəns/","d":"a punishment for something bad that you have done, that other people feel you really deserve","r":"informal","e":"From the phrasal verb come up + -ance (19th century).","s":"just deserts — what you deserve; retribution — deserved punishment, often vengeful, formal; nemesis — an agent of downfall","c":"get/receive your comeuppance","x":["In a morality tale the villain gets his comeuppance; in Hardy it is usually the innocent who suffer."],"z":["comeuppance"],"n":"","t":"literature; ethics","y":0,"g":"a punishment for something bad that you have done, that other people feel you really deserve","sy":["just deserts","retribution","nemesis"],"ez":"From the phrasal verb come up + -ance (19th century).","pp":"noun"},{"id":85,"w":"commodious","f":"","p":"adjective","i":"/kəˈməʊdiəs/","d":"having a lot of sp ulously (adv.)","p":"adjective; noun (credulity)","i":"/ˈkredʒələs/","d":"too ready to believe things and therefore easy to trick. credulity: the ability or the wish to believe that something is real or true","r":"formal","e":"Latin credulus, from credere ‘believe’ (as in credit, creed).","s":"gullible — easily tricked, the plainer word; naive — lacking experience; trusting — ready to trust, positive. Opposite: sceptical, incredulous","c":"strain/stretch credulity; a credulous public/audience","x":["Deepfakes are dangerous less because they are convincing than because audiences are credulous about anything that confirms their biases."],"z":["credulous"],"n":"Credible means believable; credulous means believing too easily.","t":"media; psychology","y":0,"g":"too ready to believe things and therefore easy to trick","sy":["gullible","naive","trusting"],"ez":"Latin credulus, from credere ‘believe’ (as in credit, creed).","pp":"adjective"},{"id":102,"w":"crummy","f":"crumby (older variant)","p":"adjective","i":"/ˈkrʌmi/","d":"of very bad quality; (crumby) covered in or full of crumbs","r":"informal","e":"A variant of crumby (crumb + -y), which first meant ‘crumbly’ or ‘covered with crumbs’; the sense ‘bad, shabby’ dates from the mid 19th century.","s":"shoddy — badly made; lousy — very bad, informal; shabby — worn and in poor condition","c":"a crummy flat/hotel/job/film","x":["He spent his first year in Delhi in a crummy rented room above a printing press."],"z":["crummy"],"n":"You wrote ‘crumby’. It is a genuine older spelling, but ‘crummy’ is now standard for the sense ‘of bad quality’.","t":"everyday","y":0,"g":"of very bad quality; (crumby) covered in or full of crumbs","sy":["shoddy","lousy","shabby"],"ez":"A variant of ——— (crumb + -y), which first meant ‘crumbly’ or ‘covered with crumbs’; the sense ‘bad, shabby’ dates from the mid 19th century.","pp":"adjective"},{"id":103,"w":"cul-de-sac","f":"plural culs-de-sac or cul-de-sacs","p":"noun","i":"/ˈkʌl də sæk/","d":  + vocare ‘call’.","s":"prevarication — evasive speech to avoid the truth; hedging — avoiding a clear commitment; doublespeak — deliberately ambiguous language","c":"without equivocation; moral/diplomatic equivocation","x":["The minister’s answer was a masterpiece of equivocation: both sides could quote it with approval.","Beijing’s equivocation to condemn Pakistan-sponsored terrorism in Kashmir and elsewhere in India has made common Indians view China as an unfriendly nation."],"z":["equivocation","equivocation"],"n":"Macbeth’s Porter mocks ‘an equivocator, that could swear in both the scales against either scale’.","t":"speech; IR","y":1,"g":"a way of behaving or speaking that is not clear or definite and is intended to avoid or hide the truth","sy":["prevarication","hedging","doublespeak"],"ez":"From ———, late Latin aequivocare ‘call by the same name’: aequus ‘equal’ + vocare ‘call’.","pp":"noun"},{"id":151,"w":"erotomania","f":"erotomaniac (n.)","p":"noun","i":"/ɪˌrəʊtəˈmeɪniə/","d":"1. a delusional belief that another person, usually of higher status, is in love with you 2. (dated) excessive sexual desire","r":"specialist (psychiatry)","e":"Greek erōtomania: erōs ‘love’ + mania ‘madness’.","s":"de Clérambault’s syndrome — the clinical name for sense 1; obsession — an idea that fills the mind; infatuation — intense, short-lived passion","c":"suffer from erotomania","x":["McEwan’s Enduring Love turns on a stranger’s erotomania: his unshakeable belief that the narrator loves him."],"z":["erotomania"],"n":"","t":"psychology; literature","y":0,"g":"a delusional belief that another person, usually of higher status, is in love with you","sy":["de Clérambault’s syndrome","obsession","infatuation"],"ez":"Greek erōtomania: erōs ‘love’ + mania ‘madness’.","pp":"noun"},{"id":152,"w":"escarpment","f":"scarp (n.)","p":"noun","i":"/ɪˈskɑːpmənt/","d":"a steep slope that separates an area of high ground from an area of lower ground","r":"","e":"French escarpement, from escarpe
