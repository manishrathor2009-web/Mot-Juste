rds as much for their euphony as for their meaning.","Poets often give more importance to euphony than to the rules of grammar."],"z":["euphony","euphony"],"n":"","t":"literature; language","y":1,"g":"the quality in words or sounds of being pleasant to listen to","sy":["mellifluousness","harmony","musicality"],"ez":"Greek euphōnia: eu ‘well’ + phōnē ‘sound’. Its opposite is cacophony.","pp":"noun"},{"id":155,"w":"evanescence","f":"evanescent (adj.) /ˌevəˈnesnt/","p":"noun; adjective (evanescent)","i":"/ˌevəˈnesns/","d":"the quality of disappearing quickly from sight or memory. evanescent: disappearing quickly","r":"literary","e":"Latin evanescere: e- ‘out’ + vanus ‘empty’ (as in vanish, vain).","s":"transience — lasting only a short time; ephemerality — being short-lived; fleetingness — passing swiftly","c":"the evanescence of beauty/fame; evanescent moments","x":["Keats found in the evanescence of beauty the very source of its intensity."],"z":["evanescence"],"n":"","t":"literature","y":0,"g":"the quality of disappearing quickly from sight or memory","sy":["transience","ephemerality","fleetingness"],"ez":"Latin evanescere: e- ‘out’ + vanus ‘empty’ (as in vanish, vain).","pp":"noun"},{"id":156,"w":"eviscerate","f":"evisceration (n.)","p":"verb","i":"/ɪˈvɪsəreɪt/","d":"1. to remove the inner organs of a body 2. (figurative) to take away the most important parts of something, so that it loses its force","r":"formal","e":"Latin eviscerare: e- ‘out’ + viscera ‘internal organs’ (as in visceral).","s":"gut — remove the insides, also figurative; hollow out — remove the substance; emasculate — deprive of force","c":"eviscerate a law/institution/argument","x":["Critics argue that the 2019 amendment eviscerated the RTI Act by giving the Centre control over commissioners’ tenure and pay.","And as the historian Mukul Kesavan’s poignant description of Delhi University’s decay reminds us, Indian leadership is eviscerating some of its best institutions."],"z":["eviscerated","eviscerating"],"n":"","t":"polity; governance","y":1,"g":"to remove the inner organs of a body","sy":["gut","hollow out","emasculate"],"ez":"Latin eviscerare: e- ‘out’ + viscera ‘internal organs’ (as in visceral).","pp":"verb"},{"id":157,"w":"excoriate","f":"excoriation (n.)","p":"verb","i":"/ɪkˈskɔːrieɪt/","d":"1. to criticize somebody/something severely 2. (medical) to make skin painful and red, so that it starts to come off","r":"formal; sense 1 medical","e":"Latin excoriare: ex- ‘out, from’ + corium ‘skin, hide’. Criticism that flays.","s":"castigate — criticize severely (also in your list); lambast — criticize harshly (also in your list); flay — criticize savagely","c":"excoriate somebody for something","x":["The Supreme Court excoriated the state police for their handling of the investigation.","Weighing in on India’s slowing growth and high inflation conundrum, senior Reserve Bank of India (RBI) officials asserted in an article on Tuesday that the “time to act is now to excoriate inflation and revive investment strongly”, even as they believed the growth trajectory is poised to lift in the second half of the year."],"z":["excoriated","excoriate"],"n":"The RBI line in your collection uses the word loosely, to mean ‘eliminate’. The standard sense is ‘criticize severely’.","t":"speech; law","y":1,"g":"to criticize somebody/something severely","sy":["castigate","lambast","flay"],"ez":"Latin excoriare: ex- ‘out, from’ + corium ‘skin, hide’. Criticism that flays.","pp":"verb"},{"id":158,"w":"exculpate","f":"exculpatory (adj.); exculpation (n.)","p":"verb","i":"/ˈekskʌlpeɪt/","d":"to prove or state officially that somebody is not guilty of something","r":"formal","e":"Medieval Latin exculpare: ex- ‘out, from’ + culpa ‘blame’ (as in culpable, culprit). Its opposite is inculpate.","s":"exonerate — officially free from blame; acquit — find not guilty in court; vindicate — clear of blame and show to be right","c":"exculpate somebody from blame; exculpatory evidence","x":["The inquiry report exculpated the pilots and blamed a faulty sensor."],"z":["exculpated"],"n":"","t":"law","y":0,"g":"to prove or state officially that somebody is not guilty of something","sy":["exonerate","acquit","vindicate"],"ez":"Medieval Latin exculpare: ex- ‘out, from’ + culpa ‘blame’ (as in culpable, culprit). Its opposite is inculpate.","pp":"verb"},{"id":159,"w":"expostulate","f":"expostulation (n.)","p":"verb","i":"/ɪkˈspɒstʃəleɪt/","d":"to argue, disagree or protest about something","r":"formal","e":"Latin expostulare ‘demand’: ex- + postulare ‘demand’ (as in postulate).","s":"remonstrate — protest forcefully (also in your list); protest — express objection; object — say you disagree","c":"expostulate with somebody (about something)","x":["‘You cannot be serious,’ he expostulated, when the Chair ruled his amendment out of order."],"z":["expostulated"],"n":"","t":"speech","y":0,"g":"to argue, disagree or protest about something","sy":["remonstrate","protest","object"],"ez":"Latin expostulare ‘demand’: ex- + postulare ‘demand’ (as in postulate).","pp":"verb"},{"id":160,"w":"extirpate","f":"extirpation (n.)","p":"verb","i":"/ˈekstəpeɪt/","d":"to destroy or get rid of something that is bad or not wanted","r":"formal","e":"Latin exstirpare: ex- ‘out’ + stirps ‘stem’. To pull up by the stem.","s":"eradicate — destroy completely, literally ‘pull out by the root’; root out — find and remove; eliminate — remove completely","c":"extirpate corruption/prejudice/a species (from a region)","x":["Laws alone cannot extirpate caste prejudice; they can only deny it the protection of the state."],"z":["extirpate"],"n":"In ecology, a species ‘extirpated’ from a region is locally extinct.","t":"society; ethics","y":0,"g":"to destroy or get rid of something that is bad or not wanted","sy":["eradicate","root out","eliminate"],"ez":"Latin exstirpare: ex- ‘out’ + stirps ‘stem’. To pull up by the stem.","pp":"verb"},{"id":161,"w":"extol","f":"extols, extolled, extolling; US also ex ’ feet","sy":["blacksmith","smith"],"ez":"Old French ferrier, from Latin ferrarius, from ferrum ‘iron, horseshoe’ (as in ferrous).","pp":"noun"},{"id":164,"w":"fecund","f":"fecundity (n.)","p":"adjective","i":"/ˈfiːkənd/","d":"1. able to produce a lot of children, crops, etc.; fertile 2. producing new and useful things, especially ideas","r":"formal","e":"French fécond or Latin fecundus ‘fruitful’.","s":"fertile — able to produce; prolific — producing much, often of writers; fruitful — producing good results","c":"fecund soil/land; a fecund imagination/period","x":["Rushdie’s fecund imagination crowds every page with digressions, puns and minor characters."],"z":["fecund"],"n":"","t":"literature; environment","y":0,"g":"able to produce a lot of children, crops, etc.; fertile","sy":["fertile","prolific","fruitful"],"ez":"French fécond or Latin fecundus ‘fruitful’.","pp":"adjective"},{"id":165,"w":"feint","f":"feint (v.)","p":"noun; verb","i":"/feɪnt/","d":"a movement meant to make your opponent think you are going to do one thing when you are really going to do something else","r":"especially in sport or war","e":"French feinte, from feindre ‘feign’.","s":"ruse — a trick to deceive; bluff — pretending strength or intention; diversion — something that draws attention away","c":"make a feint; a feint to the left","x":["The troop build-up in the north was a feint; the real offensive came in the east."],"z":["feint"],"n":"Feint (a pretend move) and faint (weak, or to lose consciousness) sound the same.","t":"conflict; strategy","y":0,"g":"a movement meant to make your opponent think you are going to do one thing when you are really going to do something else","sy":["ruse","bluff","diversion"],"ez":"French feinte, from feindre ‘feign’.","pp":"noun"},{"id":166,"w":"fetter","f":"fetters (n. pl.): chains for a prisoner’s feet","p":"verb; noun","i":"/ˈfetə(r)/","d":"1. to limit somebody’s freedom to do what they want 2. to put chains around a prisoner’s feet","r":"literary; u "devilish","fiendishly difficult"],"ez":"——— (Old English fēond ‘enemy, devil’) + -ish.","pp":"adjective"},{"id":169,"w":"fledgling","f":"British also fledgeling; fledged (adj.)","p":"noun; adjective","i":"/ˈfledʒlɪŋ/","d":"1. a young bird that has just learnt to fly 2. a person, an organization or a system that is new and without experience","r":"usually before a noun","e":"From the obsolete adjective fledge ‘ready to fly’, on the pattern of nestling.","s":"nascent — just coming into existence; budding — beginning to develop; incipient — in an early stage (also in your list)","c":"a fledgling democracy/industry/company/start-up","x":["Fledgling democracies need strong institutions more than charismatic leaders.","In a major respite to India’s fledgling start-ups, Finance Minister Nirmala Sitharaman announced scrapping of the contentious angel tax on foreign investments received by such enterprises, a development that is expected to ease their funding woes."],"z":["Fledgling","fledgling"],"n":"","t":"polity; economy","y":1,"g":"a young bird that has just learnt to fly","sy":["nascent","budding","incipient"],"ez":"From the obsolete adjective fledge ‘ready to fly’, on the pattern of nestling.","pp":"noun"},{"id":170,"w":"flibbertigibbet","f":"","p":"noun","i":"/ˌflɪbətiˈdʒɪbɪt/","d":"a silly, flighty person who talks too much","r":"informal, dated","e":"Middle English flepergebet ‘gossip’, imitating meaningless chatter. In King Lear it is the name of a devil.","s":"scatterbrain — a disorganized, forgetful person; chatterbox — someone who talks a lot; featherbrain — a silly person","c":"a giddy flibbertigibbet","x":["Dismissed by her uncle as a flibbertigibbet, she went on to run the family firm better than any of his sons."],"z":["flibbertigibbet"],"n":"King Lear, Act 3, Scene 4: Edgar, as Poor Tom, cries ‘This is the foul fiend Flibbertigibbet.’","t":"character; literature","y":0,"g":"a silly, flighty person who talks too much","sy":["scatterbrain","chatterbox","feat bly from English dialect; flummock ‘make untidy, confuse’ is recorded in the west and north Midlands.","s":"baffle — completely puzzle; perplex — puzzle and worry; bamboozle — confuse, often by trickery","c":"be flummoxed by something; completely flummoxed","x":["A question on an obscure Mughal treaty flummoxed most of the candidates.","Researchers were flummoxed by the steep increase and some told The Hindu that they believed it to be a “misprint.”"],"z":["flummoxed","flummoxed"],"n":"","t":"everyday","y":1,"g":"to confuse somebody so that they do not know what to say or do","sy":["baffle","perplex","bamboozle"],"ez":"Probably from English dialect; flummock ‘make untidy, confuse’ is recorded in the west and north Midlands.","pp":"verb"},{"id":174,"w":"foible","f":"","p":"noun","i":"/ˈfɔɪbl/","d":"a silly habit or a strange or weak aspect of a person’s character that others do not consider serious","r":"","e":"Obsolete French, from Old French fieble ‘feeble’. In fencing it is still the weaker part of a sword blade.","s":"quirk — a peculiar habit; idiosyncrasy — a personal peculiarity; weakness — a flaw","c":"human foibles; foibles and failings","x":["Recent biographies write frankly about Gandhi’s foibles, and his achievement seems larger, not smaller, for it.","In this instance, the combination of human foibles and rectitude was just right."],"z":["foibles","foibles"],"n":"","t":"character","y":1,"g":"a silly habit or a strange or weak aspect of a person’s character that others do not consider serious","sy":["quirk","idiosyncrasy","weakness"],"ez":"Obsolete French, from Old French fieble ‘feeble’. In fencing it is still the weaker part of a sword blade.","pp":"noun"},{"id":175,"w":"foppery","f":"fop (n.); foppish (adj.)","p":"noun","i":"/ˈfɒpəri/","d":"1. the behaviour or dress of a fop, a man too concerned with his clothes and appearance 2. foolishness","r":"literary","e":"From fop (Middle English ‘fool’) + -ery.","s":"dandyism — excessive concern with dress; vanity — too much pride in appearance; affectation — behaviour meant to impress","c":"the foppery of fashion","x":["Restoration comedy mocked the foppery of men like Etherege’s Sir Fopling Flutter."],"z":["foppery"],"n":"King Lear, Act 1, Scene 2: Edmund scorns astrology as ‘the excellent foppery of the world’.","t":"literature; character","y":0,"g":"the behaviour or dress of a fop, a man too concerned with his clothes and appearance","sy":["dandyism","vanity","affectation"],"ez":"From ——— (Middle English ‘fool’) + -ery.","pp":"noun"},{"id":176,"w":"frenetic","f":"frenetically (adv.)","p":"adjective","i":"/frəˈnetɪk/","d":"involving a lot of energy and activity in a way that is not organized","r":"","e":"Old French frenetique, from Greek phrenitikos, from phrenitis ‘delirium’, from phrēn ‘mind’. Compare frantic.","s":"frantic — wild with fear or hurry; hectic — full of busy activity; feverish — intensely, nervously active","c":"frenetic pace/activity/schedule","x":["The last fortnight before the Mains is frenetic: revision, answer-writing and very little sleep.","This marked a shift in strategy, or rather a frenetic changing of lanes ahead of a roundabout as drivers in the capital are prone to do, from the previous government’s preferred reliance on letting multiplier and trickle-down effects work while avoiding direct handouts to such sections of society."],"z":["frenetic","frenetic"],"n":"","t":"everyday","y":1,"g":"involving a lot of energy and activity in a way that is not organized","sy":["frantic","hectic","feverish"],"ez":"Old French frenetique, from Greek phrenitikos, from phrenitis ‘delirium’, from phrēn ‘mind’. Compare frantic.","pp":"adjective"},{"id":177,"w":"frippery","f":"","p":"noun","i":"/ˈfrɪpəri/","d":"objects, decorations and other things that are considered unnecessary and expensive","r":"especially British, disapproving","e":"French friperie ‘second-hand clothes’, from Old French frepe ‘rag’.","s":"finery — showy clothes or decoration; ostentation — se earned by good conduct, while parole is granted for a specific need.","t":"economy; law","y":0,"g":"permission to leave your duties for a period, especially for soldiers","sy":["leave","parole","lay-off"],"ez":"Dutch verlof ‘leave, permission’.","pp":"noun"},{"id":180,"w":"genuflect","f":"genuflection (n.)","p":"verb","i":"/ˈdʒenjuflekt/","d":"1. to bend one or both knees as a sign of respect, especially in a church 2. to show too much respect to somebody/something","r":"formal; sense 2 disapproving","e":"Ecclesiastical Latin genuflectere: genu ‘knee’ + flectere ‘bend’ (as in flexible).","s":"kowtow — act too humbly towards authority; grovel — behave too humbly; bow and scrape — be excessively deferential","c":"genuflect before/to somebody/something","x":["Too many editors now genuflect before the powerful and call it balance."],"z":["genuflect"],"n":"","t":"media; ethics","y":0,"g":"to bend one or both knees as a sign of respect, especially in a church","sy":["kowtow","grovel","bow and scrape"],"ez":"Ecclesiastical Latin genuflectere: genu ‘knee’ + flectere ‘bend’ (as in flexible).","pp":"verb"},{"id":181,"w":"geodesy","f":"geodetic (adj.)","p":"noun","i":"/dʒiˈɒdəsi/","d":"the science of measuring the size and shape of the earth, the exact positions of points on its surface, and its gravity field","r":"specialist","e":"Greek geōdaisia: gē ‘earth’ + daiein ‘divide’.","s":"surveying — measuring land; cartography — map-making; geodetics — the same field","c":"geodetic survey","x":["The Great Trigonometrical Survey of India, begun in 1802, was one of the most ambitious feats of geodesy ever attempted."],"z":["geodesy"],"n":"","t":"science; history","y":0,"g":"the science of measuring the size and shape of the earth, the exact positions of points on its surface, and its gravity field","sy":["surveying","cartography","geodetics"],"ez":"Greek geōdaisia: gē ‘earth’ + daiein ‘divide’.","pp":"noun"},{"id":182,"w":"gerontocracy","f":"gerontocratic (adj.)","p":"noun","i":" ely, spontaneous’ (as in gratis).","s":"unwarranted — not justified; uncalled-for — rude and unnecessary; unnecessary — not needed","c":"gratuitous violence/insult/advice","x":["The film’s gratuitous violence adds nothing to its story."],"z":["gratuitous"],"n":"","t":"ethics; media","y":0,"g":"done without any good reason or purpose and often having harmful effects","sy":["unwarranted","uncalled-for","unnecessary"],"ez":"Latin gratuitus ‘given freely, spontaneous’ (as in gratis).","pp":"adjective"},{"id":185,"w":"gridlock","f":"gridlocked (adj.)","p":"noun; verb","i":"/ˈɡrɪdlɒk/","d":"1. a situation in which there are so many vehicles in the streets that traffic cannot move at all 2. a situation in which people cannot agree and no progress can be made","r":"","e":"grid + lock (American, around 1980).","s":"deadlock — no progress because neither side will yield; stalemate — a situation in which no one can win; logjam — a blockage","c":"political/legislative gridlock; a gridlocked parliament","x":["Legislative gridlock in Washington has turned the debt ceiling into a recurring crisis.","But investors have expressed concern that a gridlocked Parliament will make it harder for a heavily indebted France to mend its finances, which could pose problems for the government down the road."],"z":["gridlock","gridlocked"],"n":"","t":"polity; IR","y":1,"g":"a situation in which there are so many vehicles in the streets that traffic cannot move at all","sy":["deadlock","stalemate","logjam"],"ez":"grid + lock (American, around 1980).","pp":"noun"},{"id":186,"w":"gubernatorial","f":"","p":"adjective","i":"/ˌɡuːbənəˈtɔːriəl/","d":"connected with the job of governor (especially a US state governor; in India, a state Governor)","r":"formal","e":"Latin gubernator ‘governor’, from gubernare ‘steer’, from Greek kubernan ‘to steer’ (as in cybernetics).","s":"executive — relating to the executive branch; vice-regal — relating to a viceroy or governor","c":"gubernatorial election/candidate/ ans","c":"the herpetofauna of a region","x":["The Western Ghats’ herpetofauna includes dozens of frog species found nowhere else on earth."],"z":["herpetofauna"],"n":"","t":"science; environment","y":0,"g":"the reptiles and amphibians of a particular region","sy":["fauna","herps"],"ez":"Greek herpeton ‘creeping thing’ + fauna.","pp":"noun"},{"id":192,"w":"herpetologist","f":"herpetology (n.)","p":"noun","i":"/ˌhɜːpɪˈtɒlədʒɪst/","d":"a scientist who studies reptiles and amphibians","r":"specialist","e":"Greek herpeton ‘creeping thing’ + -logist.","s":"zoologist — studies animals; ophiologist — studies snakes","c":"a field herpetologist","x":["Romulus Whitaker, the herpetologist who co-founded the Madras Crocodile Bank, spent decades changing how Indians see snakes."],"z":["herpetologist"],"n":"","t":"science","y":0,"g":"a scientist who studies reptiles and amphibians","sy":["zoologist","ophiologist"],"ez":"Greek herpeton ‘creeping thing’ + -logist.","pp":"noun"},{"id":193,"w":"hoary","f":"hoar (adj., n.)","p":"adjective","i":"/ˈhɔːri/","d":"1. very old and well known and therefore no longer interesting 2. (especially of hair) grey or white because a person is old","r":"old-fashioned, literary","e":"From hoar (Old English hār ‘grey-haired’), as in hoarfrost.","s":"hackneyed — overused and stale; age-old — very old; grizzled — grey-haired","c":"a hoary old chestnut/joke/myth/cliché","x":["The hoary argument that India was ‘not ready’ for universal suffrage has been answered by every general election since 1951–52.","Once again, the great hoary beast Vhagar and the far smaller Meleys grapple in the sky and once again, Rhaenys escapes largely unscathed."],"z":["hoary","hoary"],"n":"","t":"literature; polity","y":1,"g":"very old and well known and therefore no longer interesting","sy":["hackneyed","age-old","grizzled"],"ez":"From ——— (Old English hār ‘grey-haired’), as in hoarfrost.","pp":"adjective"},{"id":194,"w":"hobnob","f":"hobnobs, hobnobbed, hobnobbing","p":"verb", ors by paying early members with the money of later ones.","It is unfortunate that some Opposition parties are trying to protect those who hoodwink devotees."],"z":["hoodwink","hoodwink"],"n":"","t":"ethics; economy","y":1,"g":"to trick somebody (into doing something)","sy":["dupe","con","deceive"],"ez":"hood ‘covering’ + an old sense of wink ‘close the eyes’. It first meant ‘to blindfold’.","pp":"verb"},{"id":197,"w":"horripilation","f":"horripilate (v.)","p":"noun","i":"/hɒˌrɪpɪˈleɪʃn/","d":"the bristling of hair on the skin from cold, fear or excitement; goose pimples","r":"formal, literary","e":"Late Latin horripilatio, from horrere ‘bristle, shudder’ + pilus ‘hair’. Horror comes from the same verb.","s":"goose pimples/bumps — the everyday words; gooseflesh; piloerection — the medical term","c":"cause/produce horripilation","x":["The first bars of the anthem in a packed stadium can produce an involuntary horripilation.","Horripilation occurs in many animals other than humans.","Hearing about the ghastly incident in Manipur horripilated my skin and sent a chill down my spine."],"z":["horripilation","Horripilation","horripilated"],"n":"","t":"body; literature","y":2,"g":"the bristling of hair on the skin from cold, fear or excitement; goose pimples","sy":["goose pimples/bumps","gooseflesh","piloerection"],"ez":"Late Latin horripilatio, from horrere ‘bristle, shudder’ + pilus ‘hair’. Horror comes from the same verb.","pp":"noun"},{"id":198,"w":"hoyden","f":"hoydenish (adj.)","p":"noun","i":"/ˈhɔɪdn/","d":"a lively, noisy, carefree girl","r":"old-fashioned","e":"Perhaps from obsolete Dutch heiden ‘country lout’, literally ‘heathen’.","s":"tomboy — a girl who enjoys rough, boyish activities; romp — a lively girl, dated; minx — an impudent girl","c":"a hoydenish girl","x":["Catherine Morland begins Northanger Abbey as something of a hoyden, preferring cricket to dolls."],"z":["hoyden"],"n":"","t":"literature; character","y":0,"g":"a lively, noisy, carefree girl","sy":["tomboy","romp","minx"],"ez":"Perhaps from obsolete Dutch heiden ‘country lout’, literally ‘heathen’.","pp":"noun"},{"id":199,"w":"ignominy","f":"ignominious (adj.)","p":"noun","i":"/ˈɪɡnəmɪni/","d":"public shame and loss of honour","r":"formal","e":"Latin ignominia: in- ‘not’ + a form of nomen ‘name’. Loss of your good name.","s":"disgrace — loss of respect; humiliation — being made to feel ashamed; opprobrium — harsh public criticism","c":"the ignominy of defeat/being dropped; an ignominious retreat","x":["The captain suffered the ignominy of being dropped from the team he had led for five years."],"z":["ignominy"],"n":"","t":"ethics","y":0,"g":"public shame and loss of honour","sy":["disgrace","humiliation","opprobrium"],"ez":"Latin ignominia: in- ‘not’ + a form of nomen ‘name’. Loss of your good name.","pp":"noun"},{"id":200,"w":"imbroglio","f":"","p":"noun","i":"/ɪmˈbrəʊliəʊ/","d":"a complicated, confused or embarrassing situation that causes many problems, especially in politics","r":"formal","e":"Italian, from imbrogliare ‘confuse’. It is related to embroil.","s":"quagmire — a situation hard to escape; entanglement — a complicated involvement; fiasco — a complete failure","c":"a political/diplomatic imbroglio","x":["The seat-sharing imbroglio threatened to break the alliance before the campaign had even begun."],"z":["imbroglio"],"n":"","t":"polity","y":0,"g":"a complicated, confused or embarrassing situation that causes many problems, especially in politics","sy":["quagmire","entanglement","fiasco"],"ez":"Italian, from imbrogliare ‘confuse’. It is related to embroil.","pp":"noun"},{"id":201,"w":"imbue","f":"","p":"verb","i":"/ɪmˈbjuː/","d":"to fill somebody/something with strong feelings, opinions or values","r":"formal; often passive","e":"French imbu ‘moistened’, from Latin imbuere ‘moisten’. To soak something through.","s":"instil — put an idea or feeling in gradually; infuse — fill with a quality; permeate — spread throughout","c":"imbued with a sense of something/purpose/values","x":["The Preamble imbues the Constitution with a purpose that its articles alone could not convey.","Do you think wearing the crown suddenly imbues you with wisdom?"],"z":["imbues","imbues"],"n":"","t":"polity; ethics","y":1,"g":"to fill somebody/something with strong feelings, opinions or values","sy":["instil","infuse","permeate"],"ez":"French imbu ‘moistened’, from Latin imbuere ‘moisten’. To soak something through.","pp":"verb"},{"id":202,"w":"impenitent","f":"impenitence (n.)","p":"adjective","i":"/ɪmˈpenɪtənt/","d":"not feeling ashamed or sorry about something bad you have done","r":"formal","e":"Ecclesiastical Latin impaenitent- ‘not repenting’: in- ‘not’ + paenitere ‘repent’ (as in penitent, penance).","s":"unrepentant — not sorry; unapologetic — refusing to apologize; remorseless — without regret","c":"an impenitent sinner/offender; remain impenitent","x":["The impenitent tone of his memoir surprised readers who had expected an apology."],"z":["impenitent"],"n":"","t":"ethics","y":0,"g":"not feeling ashamed or sorry about something bad you have done","sy":["unrepentant","unapologetic","remorseless"],"ez":"Ecclesiastical Latin impaenitent- ‘not repenting’: in- ‘not’ + paenitere ‘repent’ (as in penitent, penance).","pp":"adjective"},{"id":203,"w":"imperious","f":"imperiously (adv.)","p":"adjective","i":"/ɪmˈpɪəriəs/","d":"expecting people to obey you and treating them as if they are less important than you; domineering","r":"formal","e":"Latin imperiosus ‘exercising authority, domineering’, from imperium ‘command, empire’.","s":"domineering — trying to control others; overbearing — unpleasantly bossy; high-handed — using power without consideration","c":"an imperious manner/tone/gesture","x":["The imperious manner of some district officials is a colonial inheritance the service has yet to shed."],"z":["imperious"],"n":"Imperious means arrogantly commanding; imperial means relating to an empire.","t":"character; governance","y":0,"g":"expecting people to obey you and treating them as if they are less important than you; domineering","sy":["domineering","overbearing","high-handed"],"ez":"Latin imperiosus ‘exercising authority, domineering’, from imperium ‘command, empire’.","pp":"adjective"},{"id":204,"w":"impertinent","f":"impertinence (n.)","p":"adjective","i":"/ɪmˈpɜːtɪnənt/","d":"rude and not showing respect for somebody who is older or more important","r":"rather formal","e":"Late Latin impertinent- ‘not having reference to’: in- ‘not’ + pertinere ‘pertain’. It first meant ‘irrelevant’, a sense still used in law.","s":"insolent — rude and disrespectful; impudent — cheeky; presumptuous — acting beyond what is proper","c":"an impertinent question/remark","x":["In the old district office, it was thought impertinent for a junior officer to question the Collector’s orders."],"z":["impertinent"],"n":"","t":"character; speech","y":0,"g":"rude and not showing respect for somebody who is older or more important","sy":["insolent","impudent","presumptuous"],"ez":"Late Latin ———- ‘not having reference to’: in- ‘not’ + pertinere ‘pertain’. It first meant ‘irrelevant’, a sense still used in law.","pp":"adjective"},{"id":205,"w":"impervious","f":"imperviousness (n.)","p":"adjective","i":"/ɪmˈpɜːviəs/","d":"1. not affected or influenced by something 2. not allowing a liquid or gas to pass through","r":"sense 2 specialist","e":"Latin impervius: in- ‘not’ + pervius ‘permeable’ (per ‘through’ + via ‘way’).","s":"immune — not affected; unaffected — unchanged by; impermeable — not allowing fluid through (sense 2)","c":"impervious to criticism/argument/pressure/water","x":["The regime seemed impervious to international criticism, however loudly it was voiced."],"z":["impervious"],"n":"","t":"IR; character","y":0,"g":"not affected or influenced by something","sy":["immune","unaffected","impermeable"],"ez":"Latin impervius: in- ‘not’ + pervius ‘permeable’ (per ‘through’ + via ‘way’).","pp":"adjective"},{"id":206,"w":"impetuous","f":"impetuously (adv.); impetuosity (n.)","p":"adjective","i":"/ɪmˈpetʃuəs/","d":"acting or done quickly and without thinking carefully about the results","r":"","e":"Late Latin impetuosus, from impetere ‘to attack’ (as in impetus).","s":"rash — acting without thought of consequences; impulsive — acting on sudden urges; hasty — done too quickly","c":"an impetuous decision/youth/nature","x":["An impetuous decision taken in anger can undo years of patient diplomacy."],"z":["impetuous"],"n":"","t":"character; IR","y":0,"g":"acting or done quickly and without thinking carefully about the results","sy":["rash","impulsive","hasty"],"ez":"Late Latin impetuosus, from impetere ‘to attack’ (as in impetus).","pp":"adjective"},{"id":207,"w":"implacable","f":"implacably (adv.)","p":"adjective","i":"/ɪmˈplækəbl/","d":"1. (of strong negative feelings or opinions) that cannot be changed 2. (of a person) unwilling to stop opposing somebody/something","r":"","e":"Latin implacabilis: in- ‘not’ + placabilis, from placare ‘appease’ (as in placate).","s":"relentless — never stopping; unappeasable — cannot be satisfied; intransigent — refusing to compromise (see intransigence)","c":"an implacable enemy/opponent/hostility","x":["Lady Catherine de Bourgh is an implacable opponent of Elizabeth’s marriage to Darcy."],"z":["implacable"],"n":"","t":"character; conflict","y":0,"g":"(of strong negative feelings or opinions) that cannot be changed","sy":["relentless","unappeasable","intransigent"],"ez":"Latin implacabilis: in- ‘not’ + placabilis, from placare ‘appease’ (as in placate).","pp":"adjective"},{"id":208,"w":"importune","f":"importunate (adj.); importunity (n.)","p":"verb","i":"/ˌɪmpɔːˈtjuːn/","d":"to ask somebody for something many times and in a way that is annoying","r":"formal","e":"Latin importunus ‘inconvenient, unseasonable’, based on Portunus, the god of harbours (portus ‘harbour’).","s":"pester — annoy with repeated requests; badger — pester persistently; beseech — ask urgently, formal","c":"importune somebody for something/to do something","x":["Petitioners importuned the MLA at every public event for jobs and transfers."],"z":["importuned"],"n":"","t":"governance; speech","y":0,"g":"to ask somebody for something many times and in a way that is annoying","sy":["pester","badger","beseech"],"ez":"Latin importunus ‘inconvenient, unseasonable’, based on Portunus, the god of harbours (portus ‘harbour’).","pp":"verb"},{"id":209,"w":"impressment","f":"impress (v.): to force into service","p":"noun","i":"/ɪmˈpresmənt/","d":"the act of forcing men to serve in the army or navy, or of seizing property for public use","r":"historical","e":"From impress, altered from prest ‘enlist by paying earnest money’.","s":"conscription — compulsory enlistment by law; press-ganging — forcible recruitment (see press-gang); requisition — official seizure of property","c":"the impressment of sailors","x":["British impressment of American sailors was one of the causes of the War of 1812."],"z":["impressment"],"n":"See also press-gang, which is in your list.","t":"history; law","y":0,"g":"the act of forcing men to serve in the army or navy, or of seizing property for public use","sy":["conscription","press-ganging","requisition"],"ez":"From ———, altered from prest ‘enlist by paying earnest money’.","pp":"noun"},{"id":210,"w":"incipient","f":"incipiently (adv.)","p":"adjective","i":"/ɪnˈsɪpiənt/","d":"just beginning","r":"formal","e":"Latin incipient- ‘beginning’, from incipere: in- ‘into’ + capere ‘take’.","s":"nascent — just coming into being; emerging — beginning to exist; embryonic — in a very early stage","c":"incipient crisis/insurgency/famine/signs","x":["Early-warning systems exist to catch incipient famine before it becomes visible on the streets."],"z":["incipient"],"n":"You wrote ‘Insipient’. That is a separate, rare word meaning ‘foolish’ (Latin in- + sapiens ‘wise’). I have assumed you meant incipient, which is far more common. If you did mean insipient, tell me and I’ll swap the card.","t":"polity; society","y":0,"g":"just beginning","sy":["nascent","emerging","embryonic"],"ez":"Latin ———- ‘beginning’, from incipere: in- ‘into’ + capere ‘take’.","pp":"adjective"},{"id":211,"w":"incongruity","f":"incongruous (adj.)","p":"noun","i":"/ˌɪnkənˈɡruːəti/","d":"the fact of being strange and not suitable in a situation","r":"","e":"Latin incongruus: in- ‘not’ + congruus ‘agreeing’ (as in congruent).","s":"absurdity — being ridiculous; inconsistency — not matching; discrepancy — a difference between things that should match","c":"the incongruity of something; a striking incongruity","x":["The incongruity of a luxury mall beside a flooded slum captured the city’s inequality in one image."],"z":["incongruity"],"n":"","t":"society","y":0,"g":"the fact of being strange and not suitable in a situation","sy":["absurdity","inconsistency","discrepancy"],"ez":"Latin incongruus: in- ‘not’ + congruus ‘agreeing’ (as in congruent).","pp":"noun"},{"id":212,"w":"incontrovertible","f":"incontrovertibly (adv.)","p":"adjective","i":"/ˌɪnkɒntrəˈvɜːtəbl/","d":"that is true and cannot be disagreed with or denied; indisputable","r":"formal","e":"in- ‘not’ + controvertible, from controvert ‘dispute’ (Latin contra ‘against’ + vertere ‘turn’).","s":"indisputable — cannot be questioned; irrefutable — cannot be disproved; undeniable — cannot be denied","c":"incontrovertible evidence/proof/fact","x":["The DNA evidence was incontrovertible: the accused had been in the room.","While these principles are incontrovertible, they are by no means a concrete proposal, and India will need to work on a more comprehensive vision of its path to peace."],"z":["incontrovertible","incontrovertible"],"n":"","t":"law","y":1,"g":"that is true and cannot be disagreed with or denied; indisputable","sy":["indisputable","irrefutable","undeniable"],"ez":"in- ‘not’ + controvertible, from controvert ‘dispute’ (Latin contra ‘against’ + vertere ‘turn’).","pp":"adjective"},{"id":213,"w":"incorrigible","f":"incorrigibly (adv.)","p":"adjective","i":"/ɪnˈkɒrɪdʒəbl/","d":"having bad habits that cannot be changed or improved","r":"disapproving or humorous","e":"Latin incorrigibilis: in- ‘not’ + corrigibilis, from corrigere ‘correct’.","s":"incurable — cannot be cured; inveterate — long-established and unlikely to change (also in your list); hardened — fixed in bad habits","c":"an incorrigible liar/optimist/romantic","x":["An incorrigible optimist, he believed every monsoon would be the good one."],"z":["incorrigible"],"n":"","t":"character","y":0,"g":"having bad habits that cannot be changed or improved","sy":["incurable","inveterate","hardened"],"ez":"Latin incorrigibilis: in- ‘not’ + corrigibilis, from corrigere ‘correct’.","pp":"adjective"},{"id":214,"w":"indefatigable","f":"indefatigably (adv.)","p":"adjective","i":"/ˌɪndɪˈfætɪɡəbl/","d":"never giving up or getting tired of doing something","r":"formal, approving","e":"Latin indefatigabilis: in- ‘not’ + de- ‘away, completely’ + fatigare ‘wear out’ (as in fatigue).","s":"tireless — never tiring; untiring — the same, slightly literary; dogged — persistent and determined","c":"indefatigable campaigner/energy/efforts","x":["Indefatigable RTI activists have exposed more corruption than many official inquiries."],"z":["Indefatigable"],"n":"","t":"character","y":0,"g":"never giving up or getting tired of doing something","sy":["tireless","untiring","dogged"],"ez":"Latin indefatigabilis: in- ‘not’ + de- ‘away, completely’ + fatigare ‘wear out’ (as in fatigue).","pp":"adjective"},{"id":215,"w":"indemnify","f":"indemnity (n.)","p":"verb","i":"/ɪnˈdemnɪfaɪ/","d":"1. to promise to pay somebody an amount of money if they suffer any damage or loss 2. to pay somebody an amount of money because of the damage or loss that they have suffered","r":"law","e":"Latin indemnis ‘unhurt, free from loss’: in- ‘not’ + damnum ‘loss, damage’ (as in damage).","s":"compensate — pay for loss or harm; insur et value."],"z":["indignant"],"n":"","t":"society","y":0,"g":"feeling or showing anger and surprise because you think that you have been treated unfairly","sy":["aggrieved","resentful","outraged"],"ez":"Latin indignari ‘regard as unworthy’: in- ‘not’ + dignus ‘worthy’ (as in dignity).","pp":"adjective"},{"id":218,"w":"indolent","f":"indolence (n.)","p":"adjective","i":"/ˈɪndələnt/","d":"not wanting to work; lazy","r":"formal","e":"Late Latin indolent- ‘not suffering pain’: in- ‘not’ + dolere ‘suffer’. Doctors still call a painless, slow-growing condition ‘indolent’.","s":"lazy — the plain word; slothful — very lazy, literary; idle — not working, or avoiding work","c":"indolent aristocracy/afternoon; the myth of the indolent native","x":["Colonial writers mocked the ‘indolent native’ and ignored the heat, hunger and extraction that shaped his day."],"z":["indolent"],"n":"","t":"character; history","y":0,"g":"not wanting to work; lazy","sy":["lazy","slothful","idle"],"ez":"Late Latin ———- ‘not suffering pain’: in- ‘not’ + dolere ‘suffer’. Doctors still call a painless, slow-growing condition ‘———’.","pp":"adjective"},{"id":219,"w":"inexorable","f":"inexorably (adv.)","p":"adjective","i":"/ɪnˈeksərəbl/","d":"(of a process) that cannot be stopped or changed; relentless","r":"formal","e":"Latin inexorabilis: in- ‘not’ + exorabilis, from exorare ‘entreat’. Deaf to pleading.","s":"relentless — never stopping; unstoppable — cannot be stopped; inevitable — certain to happen","c":"inexorable rise/decline/march/logic","x":["The inexorable rise of the sea will redraw the map of coastal Bengal.","Scientists don’t understand it fully at the universe’s largest and smallest scales, but fortunately for humans, a panoply of natural philosophers and inventors have allowed us to keep step with its inexorable march — with clocks."],"z":["inexorable","inexorable"],"n":"","t":"environment; history","y":1,"g":"(of a process) that cannot be stopped or changed; relentless","sy":["relentless" ething","sy":["gap","crevice","chink"],"ez":"Latin interstitium, from intersistere ‘stand between’: inter- + sistere ‘stand’.","pp":"noun"},{"id":232,"w":"intonation","f":"intone (v.)","p":"noun","i":"/ˌɪntəˈneɪʃn/","d":"1. the rise and fall of the voice in speaking, especially as this affects meaning 2. the quality of playing or singing exactly in tune","r":"phonetics; music","e":"Medieval Latin intonare: in- ‘into’ + tonus ‘tone’.","s":"inflection — change in pitch; cadence — the rhythm and fall of the voice; tone — the quality of the voice","c":"rising/falling intonation; intonation patterns","x":["Said with a different intonation, the same sentence can be a question, a complaint or a joke."],"z":["intonation"],"n":"","t":"language","y":0,"g":"the rise and fall of the voice in speaking, especially as this affects meaning","sy":["inflection","cadence","tone"],"ez":"Medieval Latin intonare: in- ‘into’ + tonus ‘tone’.","pp":"noun"},{"id":233,"w":"intransigence","f":"intransigent (adj.)","p":"noun","i":"/ɪnˈtrænzɪdʒəns/","d":"the quality of being unwilling to change your opinions or behaviour in a way that would help others","r":"formal, disapproving","e":"From intransigent, from Spanish (los) intransigentes, a name for extreme republicans in the 1870s: in- ‘not’ + transigir ‘compromise’.","s":"obstinacy — stubbornness; obduracy — stubborn refusal to change (also in your list); inflexibility — unwillingness to bend","c":"blame somebody’s intransigence; political/diplomatic intransigence","x":["Each side blamed the other’s intransigence for the collapse of the talks."],"z":["intransigence"],"n":"","t":"IR; polity","y":0,"g":"the quality of being unwilling to change your opinions or behaviour in a way that would help others","sy":["obstinacy","obduracy","inflexibility"],"ez":"From ———, from Spanish (los) ———, a name for extreme republicans in the 1870s: in- ‘not’ + transigir ‘compromise’.","pp":"noun"},{"id":234,"w":"inure","f":"inured (adj.)","p":"verb","i":"/ɪˈnjʊə(r book’. It first meant any written statement.","pp":"noun"},{"id":258,"w":"lickspittle","f":"","p":"noun","i":"/ˈlɪkspɪtl/","d":"a person who behaves too humbly towards people in power; a toady","r":"literary, disapproving","e":"lick + spittle (17th century).","s":"toady — someone who flatters to gain favour; sycophant — a flatterer of the powerful; bootlicker — informal","c":"a lickspittle courtier/press","x":["Every autocrat collects lickspittles who tell him only what he wants to hear.","While he was busy playing king, appointing lickspittle lackeys to the Kingsguard and so forth, Aemond was planning the war."],"z":["lickspittles","lickspittle"],"n":"","t":"character; polity","y":1,"g":"a person who behaves too humbly towards people in power; a toady","sy":["toady","sycophant","bootlicker"],"ez":"lick + spittle (17th century).","pp":"noun"},{"id":259,"w":"lineament","f":"usually plural: lineaments","p":"noun","i":"/ˈlɪniəmənt/","d":"a distinctive feature or characteristic, especially of the face","r":"literary","e":"Latin lineamentum, from lineare ‘draw a line’, from linea ‘line’.","s":"features — parts of the face; contours — outlines; outline — the main shape","c":"the lineaments of a face/policy/argument","x":["The lineaments of the new policy are clear, even if its details are not."],"z":["lineaments"],"n":"","t":"literature","y":0,"g":"a distinctive feature or characteristic, especially of the face","sy":["features","contours","outline"],"ez":"Latin lineamentum, from lineare ‘draw a line’, from linea ‘line’.","pp":"noun"},{"id":260,"w":"logorrhoea","f":"US logorrhea","p":"noun","i":"/ˌlɒɡəˈrɪə/","d":"a tendency to talk too much, especially in a way that is hard to follow","r":"formal, humorous; also medical","e":"Greek logos ‘word’ + -rrhoia ‘flow’ (as in diarrhoea).","s":"verbosity — using too many words; prolixity — tedious length (also in your list); garrulousness — excessive talk about trivial things","c":"verbal logorrhoea","x":["The spokesperson’s logorrhoea filled forty minutes without answering a single question."],"z":["logorrhoea"],"n":"","t":"speech","y":0,"g":"a tendency to talk too much, especially in a way that is hard to follow","sy":["verbosity","prolixity","garrulousness"],"ez":"Greek logos ‘word’ + -rrhoia ‘flow’ (as in diarrhoea).","pp":"noun"},{"id":261,"w":"loquacious","f":"loquacity (n.)","p":"adjective","i":"/ləˈkweɪʃəs/","d":"talking a lot; talkative","r":"formal","e":"Latin loquax, loquac-, from loqui ‘talk’ (as in eloquent, colloquial).","s":"talkative — the plain word; garrulous — talking too much about trivial things; voluble — speaking fluently and at length","c":"a loquacious guide/host/witness","x":["A loquacious guide kept up a running commentary all the way from Agra to Fatehpur Sikri."],"z":["loquacious"],"n":"","t":"character; speech","y":0,"g":"talking a lot; talkative","sy":["talkative","garrulous","voluble"],"ez":"Latin loquax, loquac-, from loqui ‘talk’ (as in eloquent, colloquial).","pp":"adjective"},{"id":262,"w":"lucubration","f":"lucubrate (v.)","p":"noun","i":"/ˌluːkjuˈbreɪʃn/","d":"1. laborious study, especially at night 2. (usually plural) writing produced by such study, often implying it is heavy or pedantic","r":"formal, often humorous","e":"Latin lucubratio ‘study by lamplight’, from lucubrare ‘work by lamplight’, from lux ‘light’. Burning the midnight oil.","s":"study — the plain word; cogitation — deep thought; treatise — a long formal piece of writing","c":"learned lucubrations; late-night lucubration","x":["His lucubrations on the Mauryan tax system run to four hundred footnoted pages."],"z":["lucubrations"],"n":"","t":"literature","y":0,"g":"laborious study, especially at night","sy":["study","cogitation","treatise"],"ez":"Latin lucubratio ‘study by lamplight’, from lucubrare ‘work by lamplight’, from lux ‘light’. Burning the midnight oil.","pp":"noun"},{"id":263,"w":"macerate","f":"maceration (n.)","p":"verb","i":"/ˈmæsəreɪt/","d":"to make something, especially food e, or make something/yourself noticed, especially in a way that is not wanted","r":"formal","e":"Latin obtrudere: ob- ‘towards’ + trudere ‘push’ (as in intrude).","s":"intrude — come in where not wanted; impose — force yourself on others; protrude — stick out","c":"obtrude on/upon something","x":["A good translator never lets her own voice obtrude on the author’s."],"z":["obtrude"],"n":"","t":"literature","y":0,"g":"to become noticeable, or make something/yourself noticed, especially in a way that is not wanted","sy":["intrude","impose","protrude"],"ez":"Latin obtrudere: ob- ‘towards’ + trudere ‘push’ (as in intrude).","pp":"verb"},{"id":296,"w":"obverse","f":"","p":"noun","i":"/ˈɒbvɜːs/","d":"1. the opposite or counterpart of something 2. the side of a coin or medal that has the head or main design on it","r":"formal; sense 2 specialist","e":"Latin obversus, from obvertere ‘turn towards’: ob- + vertere ‘turn’.","s":"counterpart — the matching opposite; flip side — informal, the other aspect; converse — the reverse of a statement. Opposite of reverse (coin)","c":"the obverse of something","x":["The obverse of a free press is the freedom to publish nonsense."],"z":["obverse"],"n":"","t":"logic; everyday","y":0,"g":"the opposite or counterpart of something","sy":["counterpart","flip side","converse"],"ez":"Latin obversus, from obvertere ‘turn towards’: ob- + vertere ‘turn’.","pp":"noun"},{"id":297,"w":"obviate","f":"","p":"verb","i":"/ˈɒbvieɪt/","d":"to remove a problem or the need for something","r":"formal","e":"Late Latin obviare ‘prevent’, from via ‘way’: to meet something in the way and head it off.","s":"preclude — make impossible in advance; forestall — prevent by acting first; remove — take away","c":"obviate the need for something","x":["Online registration obviates the need to queue at the district office."],"z":["obviates"],"n":"","t":"governance","y":0,"g":"to remove a problem or the need for something","sy":["preclude","forestall","remove"],"ez":"Late Lat us).","s":"burdensome — heavy to bear; taxing — demanding; arduous — very difficult and tiring","c":"an onerous task/duty/burden/condition","x":["Compliance rules for small exporters are so onerous that many simply stay outside the formal system."],"z":["onerous"],"n":"","t":"economy; governance","y":0,"g":"needing great effort; causing trouble or worry","sy":["burdensome","taxing","arduous"],"ez":"Old French onereus, from Latin onerosus, from onus, oner- ‘burden’ (as in onus).","pp":"adjective"},{"id":301,"w":"onomatopoeia","f":"onomatopoeic (adj.)","p":"noun","i":"/ˌɒnəˌmætəˈpiːə/","d":"1. the fact of words containing sounds similar to the noises they describe, for example ‘hiss’ 2. the use of words like this in writing","r":"specialist","e":"Greek onomatopoiia ‘word-making’: onoma, onomat- ‘name’ + poiein ‘make’.","s":"echoism — a rarer term for the same thing; sound symbolism — sound suggesting meaning more broadly","c":"use of onomatopoeia; onomatopoeic words","x":["Tennyson’s ‘murmuring of innumerable bees’ is the textbook case of onomatopoeia at work across a whole line.","The Formalists made it a requisite to study the sounds of the words in a poem as an independent characteristic, regarding poems as examples of onomatopoeia."],"z":["onomatopoeia","onomatopoeia"],"n":"","t":"literature","y":1,"g":"the fact of words containing sounds similar to the noises they describe, for example ‘hiss’","sy":["echoism","sound symbolism"],"ez":"Greek onomatopoiia ‘word-making’: onoma, onomat- ‘name’ + poiein ‘make’.","pp":"noun"},{"id":302,"w":"opprobrious","f":"opprobrium (n.) /əˈprəʊbriəm/","p":"adjective; noun (opprobrium)","i":"/əˈprəʊbriəs/","d":"expressing scorn or harsh criticism; abusive. opprobrium: severe public criticism of a person, country, etc. by many people","r":"formal","e":"From opprobrium, Latin ‘infamy’: ob- ‘against’ + probrum ‘disgraceful act’. Its opposite is approbation.","s":"abusive — insulting; scurrilous — making scandalous claims; vituperative — cted (also in your list)","c":"a pachydermatous politician/bureaucracy","x":["Only a pachydermatous politician could survive three decades of cartoons like these."],"z":["pachydermatous"],"n":"","t":"character; polity","y":0,"g":"thick-skinned; (figurative) not sensitive to criticism or insult","sy":["thick-skinned","insensitive","impervious"],"ez":"Greek pakhus ‘thick’ + derma ‘skin’. A ——— is a thick-skinned animal such as an elephant.","pp":"adjective"},{"id":305,"w":"palaver","f":"","p":"noun","i":"/pəˈlɑːvə(r)/","d":"1. (British) a lot of unnecessary activity, excitement or trouble, especially about something unimportant 2. (North American) talk that has no meaning","r":"informal","e":"Portuguese palavra ‘word’, from Latin parabola. It first meant a talk between traders and local people.","s":"fuss — unnecessary excitement; rigmarole — a long, complicated procedure; to-do — informal, a commotion","c":"what a palaver!; all that palaver","x":["All that palaver for a signature: three offices, two affidavits and a week’s wait."],"z":["palaver"],"n":"","t":"everyday; governance","y":0,"g":"(British) a lot of unnecessary activity, excitement or trouble, especially about something unimportant","sy":["fuss","rigmarole","to-do"],"ez":"Portuguese palavra ‘word’, from Latin parabola. It first meant a talk between traders and local people.","pp":"noun"},{"id":306,"w":"panegyric","f":"panegyrist (n.)","p":"noun","i":"/ˌpænəˈdʒɪrɪk/","d":"a speech or piece of writing praising somebody/something","r":"formal","e":"Greek panēgurikos ‘of a public assembly’: pan ‘all’ + aguris ‘assembly’ (as in agora).","s":"eulogy — a speech of praise, often at a funeral; encomium — formal high praise; paean — a song or text of praise","c":"a panegyric on/to somebody","x":["Harisena’s inscription on the Allahabad pillar is a panegyric of Samudragupta, not a neutral chronicle."],"z":["panegyric"],"n":"","t":"history; literature","y":0,"g":"a speech or piece of writing praising somebody/something","sy":["eulogy","encomium","paean"],"ez":"Greek panēgurikos ‘of a public assembly’: pan ‘all’ + aguris ‘assembly’ (as in agora).","pp":"noun"},{"id":307,"w":"panoply","f":"","p":"noun","i":"/ˈpænəpli/","d":"a large and impressive number or collection of something","r":"formal","e":"Greek panoplia ‘full armour’: pan ‘all’ + hopla ‘arms’.","s":"array — an impressive display; range — a variety; arsenal — a large collection of resources, figurative","c":"a full/whole panoply of powers/measures/options","x":["The state brought its whole panoply of powers — raids, notices, arrests — against a single newspaper."],"z":["panoply"],"n":"","t":"polity","y":0,"g":"a large and impressive number or collection of something","sy":["array","range","arsenal"],"ez":"Greek panoplia ‘full armour’: pan ‘all’ + hopla ‘arms’.","pp":"noun"},{"id":308,"w":"paraphernalia","f":"","p":"noun","i":"/ˌpærəfəˈneɪliə/","d":"a large number of objects or personal possessions, especially the equipment needed for a particular activity","r":"","e":"Medieval Latin, from Greek parapherna ‘property apart from a dowry’: para ‘beside’ + phernē ‘dowry’. It first meant a married woman’s own property.","s":"equipment — the neutral word; gear — informal; trappings — outward signs of something","c":"security/wedding/drug paraphernalia","x":["Security paraphernalia — barricades, metal detectors, rope lines — now surrounds every public event."],"z":["paraphernalia"],"n":"","t":"everyday","y":0,"g":"a large number of objects or personal possessions, especially the equipment needed for a particular activity","sy":["equipment","gear","trappings"],"ez":"Medieval Latin, from Greek parapherna ‘property apart from a dowry’: para ‘beside’ + phernē ‘dowry’. It first meant a married woman’s own property.","pp":"noun"},{"id":309,"w":"pare","f":"pare down/back (phr. v.)","p":"verb","i":"/peə(r)/","d":"1. to remove the thin outer layer of something, especially fruit 2. to gradually reduce the size or amount of something 3. to trim the edges of something, such as nails","r":"","e":"Old French parer ‘adorn, prepare, trim’, from Latin parare ‘prepare’.","s":"trim — cut to make neat; cut back — reduce; whittle down — reduce gradually","c":"pare costs/spending; pare something down to the bone","x":["The committee pared the list of beneficiaries from ten lakh to four.","Subsidies too across the board, from fertilizers to food and petroleum have been pared."],"z":["pared","pared"],"n":"Pare, pair and pear sound the same.","t":"economy","y":1,"g":"to remove the thin outer layer of something, especially fruit","sy":["trim","cut back","whittle down"],"ez":"Old French parer ‘adorn, prepare, trim’, from Latin parare ‘prepare’.","pp":"verb"},{"id":310,"w":"parenteral","f":"parenterally (adv.)","p":"adjective","i":"/pəˈrentərəl/","d":"(of drugs or nutrition) given by a route other than the digestive tract, especially by injection or drip","r":"medical","e":"para- ‘beside, beyond’ + enteral, from Greek enteron ‘intestine’.","s":"intravenous — into a vein; injectable — given by injection. Opposite: oral, enteral","c":"parenteral nutrition/administration","x":["Patients who cannot swallow may need parenteral nutrition through a drip."],"z":["parenteral"],"n":"","t":"science; body","y":0,"g":"(of drugs or nutrition) given by a route other than the digestive tract, especially by injection or drip","sy":["intravenous","injectable"],"ez":"para- ‘beside, beyond’ + enteral, from Greek enteron ‘intestine’.","pp":"adjective"},{"id":311,"w":"parochialism","f":"parochial (adj.)","p":"noun","i":"/pəˈrəʊkiəlɪzəm/","d":"the fact of only being interested in small issues in your local area and not in more important things","r":"disapproving","e":"From parochial, Latin parochia ‘parish’. The world ends at the parish boundary.","s":"provincialism — narrow local outlook; insularity — being cut off from outside ideas (see insular); narrow-mindedness — unwillingness to consider other views","c":"regional/political parochialism","x":["Parochialism in water-sharing disputes turns rivers into borders."],"z":["Parochialism"],"n":"","t":"polity; society","y":0,"g":"the fact of only being interested in small issues in your local area and not in more important things","sy":["provincialism","insularity","narrow-mindedness"],"ez":"From ———, Latin parochia ‘parish’. The world ends at the parish boundary.","pp":"noun"},{"id":312,"w":"parosmia","f":"","p":"noun","i":"/pəˈrɒzmiə/","d":"a distorted sense of smell, in which familiar things smell different, often unpleasant","r":"medical","e":"Greek para ‘beside, abnormal’ + osmē ‘smell’.","s":"anosmia — loss of smell; phantosmia — smelling things that are not there (both in your list)","c":"post-viral parosmia","x":["After Covid, many patients developed parosmia: coffee smelt of sewage and meals became an ordeal."],"z":["parosmia"],"n":"","t":"science; body","y":0,"g":"a distorted sense of smell, in which familiar things smell different, often unpleasant","sy":["anosmia","phantosmia"],"ez":"Greek para ‘beside, abnormal’ + osmē ‘smell’.","pp":"noun"},{"id":313,"w":"parsimonious","f":"parsimony (n.)","p":"adjective","i":"/ˌpɑːsɪˈməʊniəs/","d":"extremely unwilling to spend money","r":"formal","e":"From parsimony, Latin parsimonia, from parcere ‘be sparing’.","s":"miserly — hoarding money; stingy — unwilling to give; frugal — careful with money, often approving","c":"parsimonious budget/employer","x":["A parsimonious budget for school meals is a false economy."],"z":["parsimonious"],"n":"In science, the ‘principle of parsimony’ (Occam’s razor) means preferring the simplest explanation.","t":"economy; character","y":0,"g":"extremely unwilling to spend money","sy":["miserly","stingy","frugal"],"ez":"From ———, Latin parsimonia, from parcere ‘be sparing’.","pp":"adjective"},{"id":314,"w":"partake","f":"partook, partaken","p":"verb","i":"/pɑːˈteɪk/","d":"1. to eat or drink something, especially something offered to you 2. to take part in an activity","r":"for ation).","s":"conclusion — the end; summation — a closing summary, especially in court; climax — the most intense point","c":"in his/her peroration","x":["In his peroration, the counsel returned to the Constitution’s promise of dignity."],"z":["peroration"],"n":"","t":"speech; law","y":0,"g":"the final part of a speech, in which the speaker sums up the main points","sy":["conclusion","summation","climax"],"ez":"Latin peroratio, from perorare ‘speak at length’: per- ‘through’ + orare ‘speak’ (as in oration).","pp":"noun"},{"id":324,"w":"perspicacious","f":"perspicacity (n.)","p":"adjective","i":"/ˌpɜːspɪˈkeɪʃəs/","d":"able to understand somebody/something quickly and accurately; showing this","r":"formal","e":"Latin perspicax, perspicac- ‘seeing clearly’, from perspicere ‘look through’.","s":"perceptive — quick to notice and understand; astute — shrewd; shrewd — sharp in practical judgement","c":"a perspicacious observer/analysis/remark","x":["A perspicacious diplomat reads the silences in a communiqué as closely as its words.","Nearly two million in sales later, Jon and I still chuckle on the fallibility of even the most perspicacious of editors."],"z":["perspicacious","perspicacious"],"n":"Perspicacious means insightful; perspicuous means clearly expressed.","t":"character; IR","y":1,"g":"able to understand somebody/something quickly and accurately; showing this","sy":["perceptive","astute","shrewd"],"ez":"Latin perspicax, perspicac- ‘seeing clearly’, from perspicere ‘look through’.","pp":"adjective"},{"id":325,"w":"pettish","f":"pettishly (adv.)","p":"adjective","i":"/ˈpetɪʃ/","d":"bad-tempered and easily annoyed, like a sulky child; peevish","r":"","e":"From pet ‘a fit of sulking’, as in the phrase ‘in a pet’.","s":"petulant — childishly sulky (also in your list); peevish — easily irritated; sulky — silently bad-tempered","c":"a pettish remark/refusal/tone","x":["His pettish refusal to attend the swearing-in did him more harm than the defeat itself."],"z":["petti nter the moment the ration shop opened."],"z":["scrimmage"],"n":"","t":"everyday","y":0,"g":"a confused struggle or fight","sy":["scuffle","skirmish","melee"],"ez":"An alteration of dialect scrimish, a variant of skirmish.","pp":"noun"},{"id":404,"w":"scrupulous","f":"scrupulously (adv.); scruple (n.); unscrupulous (adj.)","p":"adjective","i":"/ˈskruːpjələs/","d":"1. careful about paying attention to every detail 2. careful to be honest and do what is right","r":"","e":"Latin scrupulosus, from scrupulus, literally ‘small sharp pebble’: the stone in your shoe that troubles you.","s":"meticulous — very careful about detail; conscientious — careful to do your duty; principled — acting on moral principles","c":"scrupulously honest/fair/neutral; scrupulous attention","x":["An election commission must be scrupulously neutral, and be seen to be."],"z":["scrupulously"],"n":"","t":"ethics; governance","y":0,"g":"careful about paying attention to every detail","sy":["meticulous","conscientious","principled"],"ez":"Latin scrupulosus, from scrupulus, literally ‘small sharp pebble’: the stone in your shoe that troubles you.","pp":"adjective"},{"id":405,"w":"sedulous","f":"sedulously (adv.)","p":"adjective","i":"/ˈsedjələs/","d":"showing great care, persistence and hard work","r":"formal","e":"Latin sedulus ‘zealous’, from sedulo ‘sincerely’, from se dolo ‘without guile’.","s":"assiduous — hard-working and careful (also in your list); diligent — careful and hard-working; painstaking — taking great care","c":"sedulous attention/care/effort","x":["Sedulous revision, not last-minute brilliance, carries most candidates through."],"z":["Sedulous"],"n":"","t":"character","y":0,"g":"showing great care, persistence and hard work","sy":["assiduous","diligent","painstaking"],"ez":"Latin sedulus ‘zealous’, from sedulo ‘sincerely’, from se dolo ‘without guile’.","pp":"adjective"},{"id":406,"w":"seigniorage","f":"also seignorage","p":"noun","i":"/ˈseɪnjərɪdʒ/","d":"the profit a government makes by issuing money, especially the difference between the face value of currency and the cost of producing it","r":"economics","e":"Old French seignourage ‘right of the lord’ (seigneur), especially the right to coin money.","s":"inflation tax — the hidden cost of printing money; monetization — financing a deficit by creating money","c":"seigniorage revenue/income","x":["When a central bank prints money, the seigniorage it earns is in effect a hidden tax."],"z":["seigniorage"],"n":"","t":"economy","y":0,"g":"the profit a government makes by issuing money, especially the difference between the face value of currency and the cost of producing it","sy":["inflation tax","monetization"],"ez":"Old French seignourage ‘right of the lord’ (seigneur), especially the right to coin money.","pp":"noun"},{"id":407,"w":"sententious","f":"sententiously (adv.)","p":"adjective","i":"/senˈtenʃəs/","d":"trying to sound important or intelligent, especially by expressing moral judgements","r":"formal, disapproving","e":"Latin sententiosus, from sententia ‘opinion’. It first meant ‘full of wisdom’, then grew disapproving.","s":"moralizing — preaching about right and wrong; preachy — informal, giving moral advice; pompous — self-important","c":"a sententious tone/speech/editorial","x":["Polonius is sententious to the point of parody: ‘Neither a borrower nor a lender be.’"],"z":["sententious"],"n":"","t":"speech; literature","y":0,"g":"trying to sound important or intelligent, especially by expressing moral judgements","sy":["moralizing","preachy","pompous"],"ez":"Latin sententiosus, from sententia ‘opinion’. It first meant ‘full of wisdom’, then grew disapproving.","pp":"adjective"},{"id":408,"w":"sequela","f":"plural sequelae","p":"noun","i":"/sɪˈkwiːlə/","d":"a condition that results from a previous disease or injury; (formal) a consequence","r":"medical; formal","e":"Latin sequela ‘consequence’, from sequi ‘follow’ (as in sequel).","s":"after-effect — a later effect; complication — a secondary problem; consequence — a result","c":"long-term sequelae; a sequela of something","x":["Paralysis is a well-known sequela of polio."],"z":["sequela"],"n":"","t":"science; body","y":0,"g":"a condition that results from a previous disease or injury; (formal) a consequence","sy":["after-effect","complication","consequence"],"ez":"Latin ——— ‘consequence’, from sequi ‘follow’ (as in sequel).","pp":"noun"},{"id":409,"w":"shrift","f":"short shrift (idiom)","p":"noun","i":"/ʃrɪft/","d":"confession to a priest; now almost only in ‘short shrift’: little or no attention or sympathy","r":"archaic, except in ‘short shrift’","e":"Old English scrift ‘penance’, from scrīfan ‘shrive, hear confession’, from Latin scribere ‘write’. A short shrift was the brief confession allowed before execution.","s":"brush-off — a curt rejection; cold shoulder — deliberate unfriendliness; dismissal — rejection","c":"give somebody/something short shrift; get short shrift; make short shrift of something","x":["The committee gave the petition short shrift, dismissing it within five minutes.","With the Opposition Maha Vikas Aghadi (MVA) in Maharashtra crying foul that the State was given the short shrift in the Union Budget, Railway Minister Ashwini Vaishnaw said on Wednesday that the allocation for railway projects in the State for financial year 2024-25 — the second highest in the country after Uttar Pradesh — is almost akin to a “special package”."],"z":["short shrift","short shrift"],"n":"Richard III, Act 3, Scene 4: Hastings is told, ‘Make a short shrift; he longs to see your head.’","t":"speech; literature","y":1,"g":"confession to a priest; now almost only in ‘short shrift’: little or no attention or sympathy","sy":["brush-off","cold shoulder","dismissal"],"ez":"Old English scrift ‘penance’, from scrīfan ‘shrive, hear confession’, from Latin scribere ‘write’. A ——— was the brief confession allowed before execution.","pp":"noun"},{"id":410,"w":"similitude","f":"","p":"noun","i":"/sɪˈmɪlɪtjuːd/","d":"1. the quality of being similar; likeness 2. (literary) a comparison; a simile","r":"formal","e":"Latin similitudo, from similis ‘like’.","s":"similarity — being alike; resemblance — looking alike; likeness — the state of being alike","c":"similitude between A and B","x":["The similitude between the two constitutions is no accident: one was drafted with the other open on the desk.","American capitalists look back at the period of Franco-American similitude with less nostalgia."],"z":["similitude","similitude"],"n":"","t":"literature; polity","y":1,"g":"the quality of being similar; likeness","sy":["similarity","resemblance","likeness"],"ez":"Latin similitudo, from similis ‘like’.","pp":"noun"},{"id":411,"w":"Sisyphean","f":"","p":"adjective","i":"/ˌsɪsɪˈfiːən/","d":"(of a task) impossible to complete; endless and futile","r":"","e":"From Sisyphus, who in Greek myth was condemned to roll a great stone up a hill forever, only for it to roll down again.","s":"endless — never finishing; futile — pointless; uphill — difficult and exhausting","c":"a Sisyphean task/struggle/labour","x":["Clearing the backlog feels Sisyphean: for every case decided, two more are filed.","The task feels Sisyphean, and the great need is not just for empathy and dialogue but also for fundamentally different policies."],"z":["Sisyphean","Sisyphean"],"n":"Camus ends The Myth of Sisyphus: ‘One must imagine Sisyphus happy.’","t":"literature; governance","y":1,"g":"(of a task) impossible to complete; endless and futile","sy":["endless","futile","uphill"],"ez":"From Sisyphus, who in Greek myth was condemned to roll a great stone up a hill forever, only for it to roll down again.","pp":"adjective"},{"id":412,"w":"slapdash","f":"","p":"adjective","i":"/ˈslæpdæʃ/","d":"done, or doing something, too quickly and carelessly","r":"","e":"slap + dash (17th century, first as an adverb meaning ‘all at once’).","s":"careless — without care; sloppy — messy and careless; hasty — done too quickly","c": e","touch"],"ez":"French, ‘suspicion’, from Latin suspectio.","pp":"noun"},{"id":418,"w":"spasmodic","f":"spasmodically (adv.); spasm (n.)","p":"adjective","i":"/spæzˈmɒdɪk/","d":"1. happening suddenly for short periods of time; not regular or continuous 2. caused by muscles tightening uncontrollably","r":"sense 2 specialist","e":"Greek spasmōdēs, from spasma ‘spasm’, from span ‘pull’.","s":"intermittent — stopping and starting; sporadic — occurring at irregular intervals; fitful — not steady","c":"spasmodic enforcement/efforts/fighting","x":["Spasmodic enforcement of the plastic ban has taught traders to wait it out."],"z":["Spasmodic"],"n":"","t":"governance","y":0,"g":"happening suddenly for short periods of time; not regular or continuous","sy":["intermittent","sporadic","fitful"],"ez":"Greek ———ōdēs, from spasma ‘———’, from span ‘pull’.","pp":"adjective"},{"id":419,"w":"specious","f":"speciously (adv.)","p":"adjective","i":"/ˈspiːʃəs/","d":"seeming right or true but actually wrong or false; misleading","r":"formal","e":"Latin speciosus ‘fair, beautiful’, from species ‘appearance’. Good-looking but false.","s":"spurious — false, fake (also in your list); fallacious — based on a mistaken belief; plausible — seeming reasonable, possibly false","c":"a specious argument/claim/reasoning","x":["The claim that more flyovers cure congestion is specious: new roads fill with new traffic."],"z":["specious"],"n":"Specious means attractive but false; spurious means simply false or fake.","t":"logic","y":0,"g":"seeming right or true but actually wrong or false; misleading","sy":["spurious","fallacious","plausible"],"ez":"Latin speciosus ‘fair, beautiful’, from species ‘appearance’. Good-looking but false.","pp":"adjective"},{"id":420,"w":"speleologist","f":"speleology (n.)","p":"noun","i":"/ˌspiːliˈɒlədʒɪst/","d":"a person who studies or explores caves","r":"specialist","e":"From speleology, French spéléologie, from Greek spēlaion ‘cave’.","s":"caver — someone who explores caves; potholer — (British) a cave explorer","c":"a team of speleologists","x":["Speleologists mapping Meghalaya’s caves have surveyed hundreds of kilometres of passages."],"z":["Speleologists"],"n":"","t":"science","y":0,"g":"a person who studies or explores caves","sy":["caver","potholer"],"ez":"From ———, French spéléologie, from Greek spēlaion ‘cave’.","pp":"noun"},{"id":421,"w":"spurious","f":"spuriously (adv.)","p":"adjective","i":"/ˈspjʊəriəs/","d":"1. false, although seeming to be real or true 2. based on false ideas or ways of thinking","r":"","e":"Latin spurius ‘false’. It first meant ‘illegitimate’.","s":"bogus — fake; false — not true; specious — plausible but wrong (also in your list)","c":"spurious claims/argument/correlation/drugs","x":["The report drew spurious conclusions from a sample of forty households."],"z":["spurious"],"n":"","t":"logic; science","y":0,"g":"false, although seeming to be real or true","sy":["bogus","false","specious"],"ez":"Latin spurius ‘false’. It first meant ‘illegitimate’.","pp":"adjective"},{"id":422,"w":"spurn","f":"spurned (adj.)","p":"verb","i":"/spɜːn/","d":"to reject or refuse somebody/something, especially in a proud way","r":"formal or literary","e":"Old English spurnan, related to Latin spernere ‘to scorn’.","s":"reject — refuse to accept; rebuff — reject rudely; scorn — reject with contempt","c":"spurn an offer/advances/advice","x":["The union spurned the management’s offer as ‘an insult to the workers’."],"z":["spurned"],"n":"","t":"everyday","y":0,"g":"to reject or refuse somebody/something, especially in a proud way","sy":["reject","rebuff","scorn"],"ez":"Old English spurnan, related to Latin spernere ‘to scorn’.","pp":"verb"},{"id":423,"w":"squalor","f":"squalid (adj.)","p":"noun","i":"/ˈskwɒlə(r)/","d":"dirty and unpleasant conditions","r":"","e":"Latin, from squalere ‘be dirty’.","s":"filth — disgusting dirt; degradation — a very poor condition; wretchedness — misery","c":"live in squalor; abject squalor","x":[ ft’ and ‘past history’ are everyday tautologies.","Repetition in verse is analogous to tautology in folklore."],"z":["tautologies","tautology"],"n":"","t":"language; logic","y":1,"g":"a statement in which you say the same thing twice in different words, when this is unnecessary","sy":["redundancy","pleonasm","repetition"],"ez":"Greek tautologos ‘repeating what has been said’: tauto ‘the same’ + logos ‘word’.","pp":"noun"},{"id":446,"w":"temerarious","f":"temerity (n.)","p":"adjective","i":"/ˌteməˈreəriəs/","d":"recklessly bold; rash","r":"literary","e":"Latin temerarius, from temere ‘blindly, rashly’.","s":"reckless — without thinking of danger; rash — acting without care; foolhardy — recklessly bold","c":"a temerarious act/decision","x":["It was temerarious of the young officer to contradict the minister in a public meeting."],"z":["temerarious"],"n":"Temerity (rash boldness, cheek) is the far more common form: ‘She had the temerity to question him.’","t":"character","y":0,"g":"recklessly bold; rash","sy":["reckless","rash","foolhardy"],"ez":"Latin temerarius, from temere ‘blindly, rashly’.","pp":"adjective"},{"id":447,"w":"tempest","f":"tempestuous (adj.)","p":"noun","i":"/ˈtempɪst/","d":"a violent storm; (figurative) a violent disturbance","r":"formal or literary","e":"Old French tempeste, from Latin tempestas ‘season, weather, storm’, from tempus ‘time’.","s":"storm — the plain word; gale — a very strong wind; turmoil — great disturbance","c":"a storm in a teacup (British) / a tempest in a teapot (US)","x":["The Tempest opens with a storm that Prospero has raised through his magic."],"z":["Tempest"],"n":"","t":"literature","y":0,"g":"a violent storm; (figurative) a violent disturbance","sy":["storm","gale","turmoil"],"ez":"Old French tempeste, from Latin tempestas ‘season, weather, storm’, from tempus ‘time’.","pp":"noun"},{"id":448,"w":"tenor","f":"","p":"noun","i":"/ˈtenə(r)/","d":"1. the general character or meaning of something 2. a man’s singing voice betwe /* ---------- scheduling (FSRS-4.5 style) ---------- */
const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];
const DECAY = -0.5, FACTOR = 19 / 81;
const retr = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
const initD = g => clamp(W[4] - (g - 3) * W[5], 1, 10);
const nextD = (d, g) => clamp(W[7] * initD(4) + (1 - W[7]) * (d - W[6] * (g - 3)), 1, 10);
const sRecall = (d, s, r, g) => s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);

function blankCard() { return { s: 0, d: 0, due: 0, last: -1, reps: 0, lapses: 0, intro: 0, prod: 0, used: 0, typed: 0, star: false, known: false, u: 0 }; }
function card(w) { return S.cards[w] || (S.cards[w] = blankCard()); }
function schedule(c, g, t) {
  if (!c.s) { c.s = W[g - 1]; c.d = initD(g); }
  else {
    const r = retr(Math.max(0, t - c.last), c.s), d0 = c.d;
    if (g === 1) { c.s = Math.min(c.s, sForget(d0, c.s, r)); c.lapses++; }
    else c.s = sRecall(d0, c.s, r, g);
    c.d = nextD(d0, g);
  }
  c.s = clamp(c.s, 0.2, 3650);
  c.last = t; c.reps++;
  let ivl = g === 1 ? 1 : Math.max(1, Math.round(c.s));

  c.due = t + ivl;
}

/* Stages track modes of retrieval: recognise → recall → produce */
const STAGES = ['New', 'Learning', 'Familiar', 'Strong', 'Owned'];
const STAGE_TIP = [
  'Not met yet',
  'Met; recognising it',
  'Recognised on several days',
  'Recalled from memory, spelled out',
  'Used in your own sentences: active vocabulary'
];
function stage(c) {
  if (!c || !c.intro) return 0;
  const s = c.s || 0;
  if (s >= 21 && c.typed >= 1 && (c.prod + c.used) >= 1 && c.reps >= 3) return 4;
  if (s >= 10 && c.reps >= 3 && c.typed >= 1) return 3;
  if (s >= 3 && c.reps >= 2) return 2;
  return 1;
}
const stageOf = w => stage(S.cards[w]);

/* ---------- activity log (per device, so merges add up) ---------- */
const LOGF = ['a', 'c', 'xp', 'nw', 't', 'r', 'ety', 'p', 'used', 'sent'];
function logAdd(f) {
  const k = dkey(today());
  const day = S.log[k] || (S.log[k] = {});
  const me = day[DEVICE] || (day[DEVICE] = {});
  for (const x in f) me[x] = (me[x] || 0) + f[x];
}
function dayStats(k) {
  const o = {}; LOGF.forEach(f => o[f] = 0);
  const day = S.log[k]; if (day) for (const dv in day) for (const f of LOGF) o[f] += day[dv][f] || 0;
  return o;
}
function totals() {
  const o = {}; LOGF.forEach(f => o[f] = 0);
  for (const k in S.log) { const d = dayStats(k); for (const f of LOGF) o[f] += d[f]; }
  return o;
}
const goalMet = n => { const d = dayStats(dkey(n)); return d.a >= S.settings.goal || d.r >= 1; };
function streak() {
  const t = today(); let d = goalMet(t) ? t : t - 1, n = 0;
  while (goalMet(d) || S.frozen.includes(d)) { n++; d--; }
  return n;
}
function bestStreak() {
  const days = Object.keys(S.log).map(k => Math.round(Date.parse(k) / DAY)).filter(n => goalMet(n)).concat(S.frozen).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev !== null && d === prev + 1 ? run + 1 : (d === prev ? run : 1); prev = d; best = Math.max(best, run); }

}

  const t = today(); let d = t - 1; const gaps = [];
  while (d > t - 8 && !goalMet(d) && !S.frozen.includes(d)) { gaps.push(d); d--; }
  const alive = goalMet(d) || S.frozen.includes(d);
  if (gaps.length && alive && gaps.length <= S.freezes) {
    S.frozen.push(...gaps); S.freezes -= gaps.length; save();
    setTimeout(() => toast(gaps.length === 1 ? 'A streak freeze covered yesterday.' : `Streak freezes covered ${gaps.length} missed days.`), 600);

}

  const st = streak(), m = Math.floor(st / 7);

/* ---------- levels ---------- */
const LV = [0, 200, 500, 1000, 1800, 3000, 4600, 6800, 9600, 13000];
const TITLES = ['Novice', 'Reader', 'Annotator', 'Glossator', 'Scrivener', 'Essayist', 'Rhetorician', 'Stylist', 'Lexicographer', 'Laureate'];
function level(xp) {
  let i = 0; while (i + 1 < LV.length && xp >= LV[i + 1]) i++;
  if (i === LV.length - 1) {
    const extra = Math.floor((xp - LV[i]) / 4000), base = LV[i] + extra * 4000;
    return { n: i + 1 + extra, title: 'Laureate' + (extra ? ' ' + roman(extra + 1) : ''), from: base, to: base + 4000, xp };
  }
  return { n: i + 1, title: TITLES[i], from: LV[i], to: LV[i + 1], xp };
}
function roman(n) { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }

/* ---------- curriculum ---------- */
const CURRICULUM = shuffle(WORDS.map(w => w.w), mulberry(20260924));
function newQueue() {
  const fresh = w => !(S.cards[w] && S.cards[w].intro);
  const starred = CURRICULUM.filter(w => fresh(w) && S.cards[w] && S.cards[w].star);
  return starred.concat(CURRICULUM.filter(w => fresh(w) && !(S.cards[w] && S.cards[w].star)));
}
function dueList() {
  const t = today();
  return WORDS.map(w => w.w).filter(w => { const c = S.cards[w]; return c && c.intro && c.due <= t && c.last !== t; })
    .sort((a, b) => retrNow(S.cards[a]) - retrNow(S.cards[b]));
}
function newLeftToday() { return Math.max(0, S.settings.newPerDay - dayStats(dkey(today())).nw); }
function planRound() {
  const due = dueList().slice(0, 80);
  let n = Math.min(newLeftToday(), newQueue().length);
  if (due.length > 50) n = Math.min(n, 2);
  return { due, news: newQueue().slice(0, n) };
}

function highlight(text, target) {

}
function blanked(text, target, typed) {

  const b = `<span class="blank" aria-label="blank">${hint}</span>`;

}
function senses(def) { return esc(def).replace(/ (\d)\. /g, '<br>$1. ').replace(/^1\. /, '1. ').replace(/\. (noun|verb|adjective|adverb|[a-z]+(?:\s\([a-z.]+\))?): /g, '.<br><i>$1:</i> '); }

/* =========================================================
   Exercises
   ========================================================= */
function distractors(w, n, key) {
  const val = x => key === 'w' ? x.w : key === 'g' ? x.g : key === 'sy' ? (x.sy && x.sy[0]) : '';
  const pool = WORDS.filter(x => x !== w && x.pp === w.pp && val(x));
  const seen = shuffle(pool.filter(x => S.cards[x.w] && S.cards[x.w].intro));
  const unseen = shuffle(pool.filter(x => !(S.cards[x.w] && S.cards[x.w].intro)));
  const order = seen.slice(0, 2).concat(unseen, seen.slice(2));
  const out = [], used = new Set([norm(val(w))]);
  if (key === 'sy') (w.sy || []).forEach(s => used.add(norm(s)));
  for (const x of order) { if (out.length >= n) break; const v = val(x); if (used.has(norm(v))) continue; used.add(norm(v)); out.push(v); }
  return out;
}
function clozeExample(w, preferYours) {
  const ex = examplesOf(w).filter(e => e.z && e.t.length < 420);
  if (!ex.length) return null;
  const yours = ex.filter(e => e.yours);
  if (preferYours && yours.length && Math.random() < 0.5) return pick(yours);
  return pick(ex);
}
function pickType(item) {
  const w = BYW.get(item.w), c = S.cards[item.w];
  if (item.kind === 'check') return 'meaning';
  if (item.kind === 'retry') return clozeExample(w) ? 'cloze' : 'word';
  if (item.force) return item.force;
  const st = stage(c), hasCl = !!clozeExample(w), hasSy = w.sy && w.sy.length > 0;
  const prodOK = !SES || (SES.prodN || 0) < 3;   // at most three sentences to write per round
  const bag = [];
  const add = (t, n) => { for (let i = 0; i < n; i++) bag.push(t); };
  if (st <= 1) { add('meaning', 2); add('word', 2); if (hasCl) add('cloze', 2); }
  else if (st === 2) { if (hasCl) add('cloze', 3); add('word', 2); if (hasSy) add('syn', 2); add('ety', 1); if (c.s >= 6) add('typed', 2); }
  else if (st === 3) {
    if (!c.typed) return 'typed';
    if (c.s >= 21 && !(c.prod + c.used) && prodOK) return 'produce';
    add('typed', 3); if (hasSy) add('syn', 1); if (hasCl) add('cloze', 1); if (prodOK) add('produce', 2);
  } else { add('typed', 2); if (prodOK) add('produce', 1); if (hasSy) add('syn', 1); if (hasCl) add('cloze', 1); }
  return pick(bag);
}
